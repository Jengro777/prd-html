                // ----- 统计省份 -----
                const provinceSet = new Set(locations.map((p) => p.province));
                document.getElementById("totalCount").textContent =
                    locations.length;
                document.getElementById("provinceCount").textContent =
                    provinceSet.size;

                // ----- 初始化地图 -----
                const map = L.map("map", {
                    center: [7.5, -1.5],
                    zoom: 7,
                    zoomControl: true,
                    attributionControl: false,
                });

                // 暗色底图
                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
                }).addTo(map);



                // ----- 创建信息窗口 -----


                // ----- 生成标记 (红色水滴) -----
                // 自定义红色水滴图标
                const redDropIcon = L.divIcon({
                    className: 'custom-marker-icon',
                    html: '<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg"><path d="M14 26C8 26 3 21 3 15C3 9 8 4 14 4C20 4 25 9 25 15C25 21 20 26 14 26Z" fill="#ff3b3b" stroke="white" stroke-width="1.2"/><circle cx="14" cy="15" r="7" fill="white" fill-opacity="0.3"/><circle cx="14" cy="15" r="4" fill="white" fill-opacity="0.15"/></svg>',
                    iconSize: [28, 28],
                    iconAnchor: [14, 26],
                    popupAnchor: [0, -26],
                });

                // 存储所有标记 (用于重置视图)
                const markers = [];

                locations.forEach((item) => {
                    const marker = L.marker([item.lat, item.lng], {
                        icon: redDropIcon,
                        title: item.name,
                    }).addTo(map);
                    marker.data = item;

                    // --- popup 内容生成 (复用) ---
                    function _popupContent(info) {
                        const c = info.closeTo && info.closeTo !== "-"
                            ? `<div class="detail-row"><i class="fas fa-location-dot"></i> ${info.closeTo}</div>` : "";
                        const t = info.contact
                            ? `<div class="detail-row"><i class="fas fa-phone"></i> <span class="contact">${info.contact}</span></div>` : "";
                        const h = info.hours
                            ? `<div class="detail-row"><i class="fas fa-clock"></i> ${info.hours}</div>` : "";
                        const p = info.payment
                            ? `<div class="detail-row"><i class="fas fa-credit-card"></i> ${info.payment}</div>` : "";
                        return `<div class="info-window">
                            <h3>${info.name} <span class="province-tag">${info.province}</span></h3>
                            <div class="addr">${info.address}</div>${c}${t}${h}${p}</div>`;
                    }

                    // 悬停：打开 popup
                    marker.on("mouseover", function() {
                        clearTimeout(_popupTimer);
                        marker.bindPopup(_popupContent(marker.data)).openPopup();
                    });

                    // 点击：固定显示（移出不关）
                    marker.on("click", function(e) {
                        clearTimeout(_popupTimer);
                        if (!marker.isPopupOpen()) {
                            marker.bindPopup(_popupContent(marker.data)).openPopup();
                        }
                        L.DomEvent.stopPropagation(e);
                    });

                    markers.push(marker);
                });

                // ----- 全局 popup 关闭逻辑 (通过 mousemove 判断鼠标位置) -----
                var _popupTimer = null;
                // 点击地图空白区域关闭所有 popup
                map.on("click", function() { markers.forEach(function(m) { m.closePopup(); }); });
                // mousemove 实时判断：鼠标在标记或 popup 上 → 保持；否则 → 延迟关闭
                document.getElementById("mapContainer").addEventListener("mousemove", function(e) {
                    var t = e.target;
                    // 鼠标在网点标记的图标上 → 保持
                    if (t.closest && t.closest(".custom-marker-icon")) {
                        clearTimeout(_popupTimer);
                        return;
                    }
                    // 鼠标在 popup 卡片上 → 保持
                    if (t.closest && t.closest(".leaflet-popup")) {
                        clearTimeout(_popupTimer);
                        return;
                    }
                    // 鼠标不在标记也不在 popup 上 → 延迟关闭
                    if (!_popupTimer) {
                        _popupTimer = setTimeout(function() {
                            markers.forEach(function(m) { if (m.isPopupOpen()) m.closePopup(); });
                            _popupTimer = null;
                        }, 300);
                    } else {
                        // 已经设置了定时器，但鼠标每动一次就重新计时
                        clearTimeout(_popupTimer);
                        _popupTimer = setTimeout(function() {
                            markers.forEach(function(m) { if (m.isPopupOpen()) m.closePopup(); });
                            _popupTimer = null;
                        }, 300);
                    }
                });

                // ----- 重置视图 (显示所有网点 + 边界) -----
                function resetView() {
                    const bounds = L.latLngBounds([[4.73, -3.27], [11.17, 1.19]]);
                    markers.forEach((m) => bounds.extend(m.getLatLng()));
                    map.fitBounds(bounds, { padding: [40, 40] });
                    if (map.getZoom() > 9) {
                        map.setZoom(9);
                    }
                }
                document
                    .getElementById("resetViewBtn")
                    .addEventListener("click", resetView);

                // 初始适应视图
                setTimeout(resetView, 300);

                // 窗口resize 重新适应
                let resizeTimer;
                window.addEventListener("resize", () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => resetView(), 200);
                });

                } catch(e) { initError(e.message + '\n\n' + e.stack); }
            });
