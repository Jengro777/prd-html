<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快送通 - 综合配送平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }
        
        header {
            background-color: #0085ff;
            color: white;
            padding: 15px;
            text-align: center;
            position: relative;
        }
        
        .tab-bar {
            display: flex;
            background-color: white;
            border-bottom: 1px solid #eee;
        }
        
        .tab {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            position: relative;
            cursor: pointer;
        }
        
        .tab.active {
            color: #0085ff;
            font-weight: bold;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background-color: #0085ff;
            border-radius: 3px;
        }
        
        .tab-content {
            display: none;
            padding: 15px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .restaurant-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .restaurant-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        
        .restaurant-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }
        
        .restaurant-info {
            padding: 10px;
        }
        
        .restaurant-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .restaurant-desc {
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
        }
        
        .task-type {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }
        
        .task-type button {
            flex: 1;
            padding: 10px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            height: 120px;
            margin-bottom: 15px;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            font-size: 12px;
        }
        
        .nav-item.active {
            color: #0085ff;
        }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <header>
        <h1>快送通</h1>
    </header>
    
    <div class="tab-bar">
        <button class="tab active" data-tab="food">外卖</button>
        <button class="tab" data-tab="errand">跑腿</button>
        <button class="tab" data-tab="truck">货运</button>
    </div>
    
    <!-- 外卖模块 -->
    <section id="food-tab" class="tab-content active">
        <h2>餐饮生鲜</h2>
        <div class="restaurant-list">
            <div class="restaurant-card">
                <img src="https://via.placeholder.com/150x100?text=麦当劳" alt="麦当劳" class="restaurant-img">
                <div class="restaurant-info">
                    <div class="restaurant-name">麦当劳</div>
                    <div class="restaurant-desc">
                        <span>30分钟</span>
                        <span>月售2000+</span>
                    </div>
                </div>
            </div>
            <div class="restaurant-card">
                <img src="https://via.placeholder.com/150x100?text=肯德基" alt="肯德基" class="restaurant-img">
                <div class="restaurant-info">
                    <div class="restaurant-name">肯德基</div>
                    <div class="restaurant-desc">
                        <span>35分钟</span>
                        <span>月售1800+</span>
                    </div>
                </div>
            </div>
            <div class="restaurant-card">
                <img src="https://via.placeholder.com/150x100?text=星巴克" alt="星巴克" class="restaurant-img">
                <div class="restaurant-info">
                    <div class="restaurant-name">星巴克</div>
                    <div class="restaurant-desc">
                        <span>25分钟</span>
                        <span>月售1500+</span>
                    </div>
                </div>
            </div>
            <div class="restaurant-card">
                <img src="https://via.placeholder.com/150x100?text=必胜客" alt="必胜客" class="restaurant-img">
                <div class="restaurant-info">
                    <div class="restaurant-name">必胜客</div>
                    <div class="restaurant-desc">
                        <span>40分钟</span>
                        <span>月售1200+</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- 跑腿模块 -->
    <section id="errand-tab" class="tab-content">
        <h2>帮我送/帮我买</h2>
        <div class="task-type">
            <button data-type="deliver">帮我送</button>
            <button data-type="buy">帮我买</button>
        </div>
        <textarea placeholder="请详细描述您的需求（如：帮买一杯星巴克拿铁，冰的，大杯）"></textarea>
        <input type="text" placeholder="预算金额（可选）">
        <button style="width: 100%; padding: 12px; background-color: #0085ff; color: white; border: none; border-radius: 8px;">发布需求</button>
    </section>
    
    <!-- 货运模块 -->
    <section id="truck-tab" class="tab-content">
        <h2>拉货/搬家</h2>
        <select id="vehicle-type">
            <option>小面包车</option>
            <option>中货车</option>
            <option>大货车</option>
            <option>跨城专线</option>
        </select>
        <input type="text" placeholder="起点位置">
        <input type="text" placeholder="终点位置">
        <input type="text" placeholder="货物类型（如：家具、电器）">
        <input type="text" placeholder="货物体积（m³）">
        <button style="width: 100%; padding: 12px; background-color: #0085ff; color: white; border: none; border-radius: 8px;">立即叫车</button>
    </section>
    
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div>首页</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📦</div>
            <div>订单</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </div>
    
    <script>
        // 切换标签页
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // 移除所有active类
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // 添加active类到当前标签
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab') + '-tab';
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // 底部导航切换
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
