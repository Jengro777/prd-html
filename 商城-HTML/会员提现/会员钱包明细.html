<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>钱包明细</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --tos-primary: #42b7ae; --tos-primary-bg: #e6f7f6; --tos-bg: #f5f7fa; --tos-text: #333; --tos-text-secondary: #666; --tos-text-muted: #999; --tos-success: #52c41a; --tos-warning: #faad14; --tos-error: #f5222d; --tos-border: #e5e7eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--tos-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--tos-text); -webkit-font-smoothing: antialiased; }
        .sidebar { width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid #f0f2f5; position: fixed; left: 0; top: 0; bottom: 0; display: flex; flex-direction: column; z-index: 10; }
        .sidebar__head { padding: 20px 16px 16px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; gap: 10px; }
        .sidebar__logo { width: 34px; height: 34px; border-radius: 8px; background: var(--tos-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .sidebar__title { font-size: 15px; font-weight: 700; white-space: nowrap; }
        .sidebar__nav { flex: 1; padding: 8px 0; overflow-y: auto; }
        .sidebar__group-title { padding: 12px 14px 4px; font-size: 10px; color: var(--tos-text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
        .sidebar__item { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13px; color: var(--tos-text-secondary); cursor: pointer; text-decoration: none; border-left: 3px solid transparent; transition: all .12s; }
        .sidebar__item:hover { background: #f5f5f5; color: var(--tos-text); }
        .sidebar__item--active { color: var(--tos-primary); font-weight: 600; background: var(--tos-primary-bg); border-left-color: var(--tos-primary); }
        .sidebar__item i { width: 16px; text-align: center; font-size: 12px; }
        .h5-container { width: 414px; margin: 0 auto; min-height: 100vh; background: var(--tos-bg); position: relative; }
        .h5-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--tos-border); }
        .h5-header__back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--tos-text); cursor: pointer; background: none; border: none; }
        .h5-header__title { flex: 1; font-size: 17px; font-weight: 600; text-align: center; }
        .h5-header__menu { width: 32px; height: 32px; display: none; align-items: center; justify-content: center; font-size: 20px; color: var(--tos-text); cursor: pointer; background: none; border: none; flex-shrink: 0; }
        .h5-page { padding: 12px 16px 24px; }
        .h5-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .h5-stat { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #f0f2f5; }
        .h5-stat__label { font-size: 11px; color: var(--tos-text-muted); }
        .h5-stat__value { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .h5-filter { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
        .h5-filter-chip { flex-shrink: 0; padding: 6px 12px; border-radius: 16px; font-size: 12px; border: 1px solid var(--tos-border); background: #fff; color: var(--tos-text-secondary); cursor: pointer; white-space: nowrap; }
        .h5-filter-chip--active { background: var(--tos-primary); color: #fff; border-color: var(--tos-primary); }
        .h5-tx-list { display: flex; flex-direction: column; gap: 6px; }
        .h5-tx-card { background: #fff; border-radius: 10px; padding: 12px 14px; border: 1px solid #f0f2f5; display: flex; align-items: center; gap: 12px; }
        .h5-tx-card__icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .tx-income { background: #f0faf0; } .tx-withdraw { background: #fff1f0; } .tx-refund { background: var(--tos-primary-bg); } .tx-reward { background: #fff7e6; } .tx-adjust { background: #f5f0ff; }
        .h5-tx-card__info { flex: 1; min-width: 0; }
        .h5-tx-card__type { font-size: 14px; font-weight: 600; }
        .h5-tx-card__ref { font-size: 11px; color: var(--tos-text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .h5-tx-card__date { font-size: 11px; color: var(--tos-text-muted); }
        .h5-tx-card__amount { text-align: right; flex-shrink: 0; }
        .h5-tx-card__amount .in { color: var(--tos-success); font-weight: 700; font-size: 15px; }
        .h5-tx-card__amount .out { color: var(--tos-error); font-weight: 700; font-size: 15px; }
        .h5-tx-card__amount .balance { font-size: 11px; color: var(--tos-text-muted); margin-top: 2px; }
        .h5-empty { text-align: center; padding: 48px 20px; color: var(--tos-text-muted); font-size: 14px; }
        @media (max-width: 680px) { .sidebar { display: none; } .h5-header__menu { display: flex; } .h5-container { width: 100%; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar__head"><div class="sidebar__logo"><i class="fas fa-wallet"></i></div><span class="sidebar__title">会员中心</span></div>
        <nav class="sidebar__nav">
            <div class="sidebar__group-title">提现管理</div>
            <a class="sidebar__item" href="会员提现申请.html"><i class="fas fa-coins"></i> 提现</a>
            <a class="sidebar__item" href="会员提现记录.html"><i class="fas fa-list-check"></i> 提现记录</a>
            <a class="sidebar__item sidebar__item--active" href="会员钱包明细.html"><i class="fas fa-file-invoice"></i> 钱包明细</a>
            <a class="sidebar__item" href="会员提现详情.html"><i class="fas fa-receipt"></i> 提现详情</a>
            <div class="sidebar__group-title">账户管理</div>
            <a class="sidebar__item" href="会员卡包管理.html"><i class="fas fa-credit-card"></i> 我的卡包</a>
            <a class="sidebar__item" href="会员绑定银行卡.html"><i class="fas fa-plus-circle"></i> 绑定银行卡</a>
        </nav>
    </aside>
    <div class="h5-container">
        <div class="h5-header">
            <button class="h5-header__menu" onclick="document.getElementById('sidebar').style.display='block';this.style.display='none';">☰</button>
            <button class="h5-header__back" onclick="history.back()">←</button>
            <span class="h5-header__title">钱包明细</span>
            <span style="width:32px;"></span>
        </div>
        <div class="h5-page">
            <div class="h5-stats">
                <div class="h5-stat"><div class="h5-stat__label">期初余额</div><div class="h5-stat__value">¥5,280</div></div>
                <div class="h5-stat"><div class="h5-stat__label">累计收入</div><div class="h5-stat__value" style="color:var(--tos-success);">+¥14,620</div></div>
                <div class="h5-stat"><div class="h5-stat__label">累计支出</div><div class="h5-stat__value" style="color:var(--tos-error);">-¥11,650</div></div>
                <div class="h5-stat"><div class="h5-stat__label">当前余额</div><div class="h5-stat__value" style="color:var(--tos-primary);">¥8,250</div></div>
            </div>
            <div class="h5-filter" id="filterBar">
                <span class="h5-filter-chip h5-filter-chip--active" data-type="" onclick="filterType(this,'')">全部</span>
                <span class="h5-filter-chip" data-type="income" onclick="filterType(this,'income')">佣金收入</span>
                <span class="h5-filter-chip" data-type="withdraw" onclick="filterType(this,'withdraw')">提现</span>
                <span class="h5-filter-chip" data-type="refund" onclick="filterType(this,'refund')">退款</span>
                <span class="h5-filter-chip" data-type="reward" onclick="filterType(this,'reward')">奖励金</span>
            </div>
            <div class="h5-tx-list" id="txList"></div>
        </div>
    </div>
</div>
<script>
const txs=[{id:'MBL-20260105-001',type:'income',label:'佣金收入',icon:'💼',ref:'推广佣金 · 1月结算',date:'01-05',income:1500,expense:0,balance:6780},{id:'MBL-20260120-002',type:'reward',label:'奖励金',icon:'🎁',ref:'新会员邀请奖励',date:'01-20',income:200,expense:0,balance:6980},{id:'MBL-20260210-003',type:'withdraw',label:'提现',icon:'🏦',ref:'MWD-20260210-1001',date:'02-10',income:0,expense:1500,balance:5480},{id:'MBL-20260215-004',type:'income',label:'佣金收入',icon:'💼',ref:'推广佣金 · 2月结算',date:'02-15',income:3200,expense:0,balance:8680},{id:'MBL-20260301-005',type:'refund',label:'退款',icon:'↩️',ref:'订单退款 ORD-20260228-889',date:'03-01',income:0,expense:280,balance:8400},{id:'MBL-20260315-006',type:'withdraw',label:'提现',icon:'🏦',ref:'MWD-20260315-1001',date:'03-15',income:0,expense:2000,balance:6400},{id:'MBL-20260320-007',type:'income',label:'佣金收入',icon:'💼',ref:'推广佣金 · 3月结算',date:'03-20',income:5000,expense:0,balance:11400},{id:'MBL-20260401-008',type:'withdraw',label:'提现',icon:'🏦',ref:'MWD-20260401-2003',date:'04-01',income:0,expense:5000,balance:6400},{id:'MBL-20260405-009',type:'adjust',label:'调账',icon:'⚙️',ref:'多扣费用返还',date:'04-05',income:150,expense:0,balance:6550},{id:'MBL-20260420-010',type:'reward',label:'奖励金',icon:'🎁',ref:'月度活跃奖励 TOP10',date:'04-20',income:500,expense:0,balance:7050},{id:'MBL-20260520-012',type:'withdraw',label:'提现',icon:'🏦',ref:'MWD-20260520-3015',date:'05-20',income:0,expense:1500,balance:5550},{id:'MBL-20260601-013',type:'income',label:'佣金收入',icon:'💼',ref:'推广佣金 · 5月结算',date:'06-01',income:2800,expense:0,balance:8350},{id:'MBL-20260701-016',type:'withdraw',label:'提现',icon:'🏦',ref:'MWD-20260701-5008',date:'07-01',income:0,expense:3500,balance:5250}];
const txClass={income:'tx-income',withdraw:'tx-withdraw',refund:'tx-refund',reward:'tx-reward',adjust:'tx-adjust'};
let typeFilter='';
function renderList(){const f=typeFilter?txs.filter(t=>t.type===typeFilter):txs;const c=document.getElementById('txList');if(!f.length){c.innerHTML='<div class="h5-empty">📭<br>暂无流水记录</div>';return;}c.innerHTML=f.map(t=>'<div class="h5-tx-card" data-type="'+t.type+'"><div class="h5-tx-card__icon '+(txClass[t.type]||'tx-income')+'">'+t.icon+'</div><div class="h5-tx-card__info"><div class="h5-tx-card__type">'+t.label+'</div><div class="h5-tx-card__ref">'+t.ref+'</div><div class="h5-tx-card__date">'+t.date+' · '+t.id+'</div></div><div class="h5-tx-card__amount"><div class="'+(t.income>0?'in':'out')+'">'+(t.income>0?'+¥'+t.income:(t.expense>0?'-¥'+t.expense:'—'))+'</div><div class="balance">余额 ¥'+t.balance.toLocaleString()+'</div></div></div>').join('');}
function filterType(el,type){typeFilter=type;document.querySelectorAll('.h5-filter-chip').forEach(c=>c.classList.remove('h5-filter-chip--active'));el.classList.add('h5-filter-chip--active');renderList();}
renderList();
</script>
</body>
</html>
