<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS对接配置 | 商城后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 32px;
            color: #1a2c3e;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0a2540;
        }
        .header p {
            color: #5c6f87;
            margin-top: 6px;
            font-size: 0.85rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e4e9f0;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .card-header {
            padding: 16px 24px;
            border-bottom: 1px solid #eef2f7;
            background: #fafcfd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .badge {
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e5a7d;
        }
        .card-body {
            padding: 20px 24px;
        }
        .wms-item {
            background: #fafcff;
            border: 1px solid #eef3fc;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .wms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .wms-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .wms-name h4 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .status-tag {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-active {
            background: #e6f7e6;
            color: #2e7d32;
        }
        .status-inactive {
            background: #ffebee;
            color: #c62828;
        }
        .config-row {
            display: flex;
            margin-bottom: 14px;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .config-label {
            width: 100px;
            font-size: 0.8rem;
            color: #5c6f87;
            flex-shrink: 0;
        }
        .config-value {
            flex: 1;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .config-value input, .config-value select {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            border: 1px solid #cbdde9;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #cbdde9;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-primary {
            background: #1a6d8f;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eef2f7;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2c3e;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 1000;
        }
        .help-text {
            font-size: 0.7rem;
            color: #8ba0bc;
            margin-top: 12px;
        }
        hr {
            margin: 16px 0;
            border-color: #eef2f7;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔌 WMS对接配置</h1>
        <p>管理WMS平台连接信息（固定平台，不可新增）</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>WMS平台列表</h3>
            <span class="badge">共2个平台</span>
        </div>
        <div class="card-body">
            <div id="wmsList"></div>
            <div class="help-text">
                💡 提示：WMS平台由系统预置，如需新增请联系管理员
            </div>
        </div>
    </div>

    <div class="footer-actions">
        <button class="btn-outline" id="cancelBtn">取消</button>
        <button class="btn-primary" id="confirmBtn">保存配置</button>
    </div>
</div>

<script>
    let wmsData = {
        platforms: [
            {
                id: "wms_self",
                name: "自有WMS",
                endpoint: "https://wms.self.com/api",
                apiKey: "sk_self_xxxxxxxx",
                status: "active",
                description: "内部自研仓储管理系统"
            },
            {
                id: "wms_delzoa",
                name: "Delzoa WMS",
                endpoint: "https://api.delzoa.com/wms",
                apiKey: "dk_delzoa_xxxxxxxx",
                status: "active",
                description: "第三方仓储服务商"
            }
        ]
    };

    function loadFromLocal() {
        const saved = localStorage.getItem("wms_platform_config");
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                wmsData = { ...wmsData, ...parsed };
            } catch(e) {}
        }
    }

    function saveToLocal() {
        localStorage.setItem("wms_platform_config", JSON.stringify(wmsData));
    }

    function renderWmsList() {
        const container = document.getElementById("wmsList");
        if (!container) return;
        container.innerHTML = "";

        wmsData.platforms.forEach(wms => {
            const div = document.createElement("div");
            div.className = "wms-item";
            div.innerHTML = `
                <div class="wms-header">
                    <div class="wms-name">
                        <h4>📦 ${wms.name}</h4>
                        <span class="status-tag ${wms.status === 'active' ? 'status-active' : 'status-inactive'}">
                            ${wms.status === 'active' ? '已启用' : '已停用'}
                        </span>
                    </div>
                    <div>
                        <button class="btn-outline toggle-wms" data-id="${wms.id}" style="margin-right: 8px;">
                            ${wms.status === 'active' ? '停用' : '启用'}
                        </button>
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-label">接口地址</div>
                    <div class="config-value">
                        <input type="text" value="${wms.endpoint}" data-id="${wms.id}" data-field="endpoint" class="wms-input">
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-label">API Key</div>
                    <div class="config-value">
                        <input type="password" value="${wms.apiKey}" data-id="${wms.id}" data-field="apiKey" class="wms-input">
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-label">备注说明</div>
                    <div class="config-value">
                        <input type="text" value="${wms.description}" data-id="${wms.id}" data-field="description" class="wms-input">
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        // 绑定输入框变更
        document.querySelectorAll(".wms-input").forEach(input => {
            input.addEventListener("change", (e) => {
                const wmsId = input.dataset.id;
                const field = input.dataset.field;
                const wms = wmsData.platforms.find(w => w.id === wmsId);
                if (wms) {
                    wms[field] = input.value;
                    showToast(`${wms.name} 的 ${field} 已更新`);
                }
            });
        });

        // 绑定启用/停用
        document.querySelectorAll(".toggle-wms").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const wmsId = btn.dataset.id;
                const wms = wmsData.platforms.find(w => w.id === wmsId);
                if (wms) {
                    wms.status = wms.status === "active" ? "inactive" : "active";
                    renderWmsList();
                    showToast(`${wms.name} 已${wms.status === "active" ? "启用" : "停用"}`);
                }
            });
        });
    }

    document.getElementById("confirmBtn")?.addEventListener("click", () => {
        saveToLocal();
        showToast("✅ WMS配置已保存");
    });

    document.getElementById("cancelBtn")?.addEventListener("click", () => {
        loadFromLocal();
        renderWmsList();
        showToast("已撤销更改");
    });

    function showToast(msg) {
        let toast = document.querySelector(".toast");
        if (toast) toast.remove();
        const div = document.createElement("div");
        div.className = "toast";
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }

    loadFromLocal();
    renderWmsList();
</script>
</body>
</html>
