<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>拒签报表</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            :root {
                --primary: #42b7ae;
                --primary-hover: #339b94;
                --primary-bg: #e6f7f6;
                --bg: #f5f7fa;
                --card: #fff;
                --border: #e5e7eb;
                --border-soft: #f0f2f5;
                --text: #333;
                --text-secondary: #666;
                --text-muted: #999;
                --success: #52c41a;
                --warning: #faad14;
                --error: #f5222d;
                --radius-card: 12px;
                --radius-control: 8px;
                --radius-tag: 4px;
                --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.03);
                --sidebar-width: 220px;
                --header-height: 64px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                font-size: 14px;
                line-height: 1.5;
            }
            .shell {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .header {
                position: sticky;
                top: 0;
                z-index: 30;
                display: flex;
                height: var(--header-height);
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 0 24px;
                border-bottom: 1px solid var(--border-soft);
                background: rgba(255, 255, 255, 0.96);
                backdrop-filter: blur(10px);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .brand-icon {
                display: flex;
                width: 32px;
                height: 32px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background: var(--primary);
                color: #fff;
                font-size: 16px;
            }
            .brand-title {
                color: #1f2937;
                font-size: 18px;
                font-weight: 600;
            }

            .main-wrap {
                display: flex;
                flex: 1;
                min-height: 0;
            }

            .sidebar {
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
                width: var(--sidebar-width);
                flex-shrink: 0;
                background: #fff;
                border-right: 1px solid var(--border-soft);
                padding: 20px 0;
                position: sticky;
                top: var(--header-height);
                height: calc(100vh - var(--header-height));
                overflow-y: auto;
            }
            .sidebar-section {
                padding: 0 12px;
                margin-bottom: 24px;
            }
            .sidebar-label {
                padding: 4px 12px 8px;
                color: var(--text-muted);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.8px;
            }
            .sidebar-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
                border-radius: 8px;
                color: var(--text-secondary);
                font-size: 14px;
                text-decoration: none;
                transition: all 0.12s;
            }
            .sidebar-item i {
                width: 18px;
                font-size: 14px;
                text-align: center;
                flex-shrink: 0;
            }
            .sidebar-item:hover {
                background: var(--bg);
                color: var(--primary);
            }
            .sidebar-item.active {
                background: var(--primary-bg);
                color: var(--primary);
                font-weight: 500;
            }

            .content {
                flex: 1;
                min-width: 0;
                padding: 24px;
            }
            .page-header {
                margin-bottom: 24px;
            }
            .page-header h1 {
                color: #1f2937;
                font-size: 20px;
                font-weight: 600;
            }
            .page-header p {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 13px;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
                box-shadow: var(--shadow-card);
                padding: 20px;
            }
            .card + .card {
                margin-top: 20px;
            }
            .card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 16px;
            }
            .card-title {
                font-size: 16px;
                font-weight: 600;
            }
            .card-desc {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 12px;
            }

            .form-row {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px 20px;
            }
            .form-row-2 {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px 20px;
            }
            .form-label {
                display: block;
                margin-bottom: 6px;
                color: var(--text-secondary);
                font-size: 13px;
            }
            .form-control {
                width: 100%;
                height: 36px;
                padding: 0 11px;
                border: 1px solid var(--border);
                border-radius: var(--radius-control);
                background: #fff;
                color: var(--text);
                font-size: 14px;
                font-family: inherit;
                outline: none;
                transition: border-color 0.2s;
            }
            .form-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(66, 183, 174, 0.16);
            }
            select.form-control {
                appearance: auto;
                cursor: pointer;
            }
            .form-help {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 12px;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 36px;
                padding: 0 16px;
                border-radius: var(--radius-control);
                font-size: 14px;
                font-family: inherit;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                white-space: nowrap;
                border: 1px solid var(--border);
                background: #fff;
                color: var(--text);
                text-decoration: none;
            }
            .btn:hover {
                border-color: #d1d5db;
                background: #fafafa;
            }
            .btn-primary {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }
            .btn-primary:hover {
                background: var(--primary-hover);
                border-color: var(--primary-hover);
            }
            .btn-danger {
                color: var(--error);
            }
            .btn-sm {
                height: 32px;
                padding: 0 12px;
                font-size: 13px;
            }
            .btn-xs {
                height: 28px;
                padding: 0 8px;
                font-size: 12px;
            }

            .actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .actions-right {
                justify-content: flex-end;
            }
            .mt-4 {
                margin-top: 16px;
            }

            .table-wrap {
                overflow-x: auto;
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
            }
            table {
                width: 100%;
                min-width: 800px;
                border-collapse: collapse;
                table-layout: fixed;
            }
            table th {
                padding: 12px 16px;
                background: #fafafa;
                border-bottom: 1px solid var(--border-soft);
                color: var(--text-secondary);
                font-size: 13px;
                font-weight: 500;
                text-align: left;
            }
            table td {
                padding: 12px 16px;
                border-bottom: 1px solid #f5f5f5;
                color: var(--text);
                font-size: 14px;
                vertical-align: middle;
            }
            table tbody tr:last-child td {
                border-bottom: 0;
            }
            table tr:hover td {
                background: #fafafa;
            }

            .tag {
                display: inline-flex;
                height: 22px;
                align-items: center;
                padding: 0 8px;
                border-radius: var(--radius-tag);
                font-size: 12px;
                font-weight: 500;
                line-height: 20px;
                white-space: nowrap;
            }
            .tag-default {
                background: #f5f5f5;
                color: var(--text-secondary);
            }
            .tag-primary {
                background: var(--primary-bg);
                color: var(--primary);
            }
            .tag-success {
                background: #f0faf0;
                color: var(--success);
            }
            .tag-warning {
                background: #fff7e6;
                color: var(--warning);
            }
            .tag-error {
                background: #fff1f0;
                color: var(--error);
            }

            .stat-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                margin-bottom: 24px;
            }
            .stat {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 18px 20px;
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
                background: #fff;
            }
            .stat-label {
                color: var(--text-muted);
                font-size: 12px;
            }
            .stat-value {
                margin-top: 4px;
                color: #1f2937;
                font-size: 24px;
                font-weight: 600;
                line-height: 1.2;
            }
            .stat-icon {
                display: flex;
                width: 40px;
                height: 40px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background: var(--primary-bg);
                color: var(--primary);
                font-size: 18px;
                flex-shrink: 0;
            }
            .stat-icon--success {
                background: #f0faf0;
                color: var(--success);
            }
            .stat-icon--warning {
                background: #fff7e6;
                color: var(--warning);
            }
            .stat-icon--error {
                background: #fff1f0;
                color: var(--error);
            }

            /* Progress bar */
            .progress {
                display: flex;
                height: 6px;
                background: #f0f0f0;
                border-radius: 3px;
                overflow: hidden;
                min-width: 60px;
            }
            .progress-bar {
                border-radius: 3px;
                transition: width 0.3s;
            }

            .pagination {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 4px;
            }
            .pagination button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 32px;
                height: 32px;
                padding: 0 6px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: #fff;
                color: var(--text);
                font-size: 13px;
                cursor: pointer;
            }
            .pagination button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .pagination button.active {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }
            .pagination button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .pagination .info {
                margin-left: 12px;
                color: var(--text-muted);
                font-size: 13px;
            }

            /* Modal */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 100;
                background: rgba(0, 0, 0, 0.4);
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.open {
                display: flex;
            }
            .modal {
                width: 560px;
                max-width: calc(100vw - 40px);
                max-height: calc(100vh - 40px);
                background: #fff;
                border-radius: var(--radius-card);
                box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
                display: flex;
                flex-direction: column;
            }
            .modal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px 0;
                font-size: 16px;
                font-weight: 600;
            }
            .modal-close {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border: none;
                background: none;
                border-radius: 6px;
                color: var(--text-muted);
                font-size: 16px;
                cursor: pointer;
            }
            .modal-close:hover {
                background: var(--bg);
                color: var(--text);
            }
            .modal-body {
                padding: 20px 24px;
                overflow-y: auto;
                flex: 1;
            }
            .modal-footer {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                padding: 12px 24px;
                border-top: 1px solid var(--border-soft);
            }
            .modal-info {
                padding: 12px 16px;
                border-radius: 8px;
                background: #e6f7f6;
                color: var(--primary);
                font-size: 13px;
                line-height: 1.5;
                margin-bottom: 16px;
            }
            .modal-info i {
                margin-right: 6px;
            }

            /* Drawer */
            .drawer-overlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 100;
                background: rgba(0, 0, 0, 0.3);
            }
            .drawer-overlay.open {
                display: flex;
                justify-content: flex-end;
            }
            .drawer {
                width: 540px;
                max-width: calc(100vw - 40px);
                height: 100vh;
                background: #fff;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
            }
            .drawer-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px;
                border-bottom: 1px solid var(--border-soft);
                font-size: 16px;
                font-weight: 600;
            }
            .drawer-body {
                padding: 24px;
                overflow-y: auto;
                flex: 1;
            }

            .avatar {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: var(--primary-bg);
                color: var(--primary);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                font-weight: 600;
                flex-shrink: 0;
            }

            .empty-state {
                padding: 48px 20px;
                color: var(--text-muted);
                text-align: center;
            }
            .empty-state i {
                margin-bottom: 12px;
                color: #d0d5dd;
                font-size: 40px;
            }

            .checkbox-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .checkbox-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px;
                cursor: pointer;
            }


            .tab-bar { display:flex; gap:0; margin-bottom:20px; border-bottom:1px solid var(--border-soft); background:#fff; border-radius:var(--radius-card) var(--radius-card) 0 0; padding:0 20px; }
            .tab { display:flex; align-items:center; height:44px; padding:0 16px; border:none; border-bottom:2px solid transparent; background:none; color:var(--text-secondary); font-size:14px; cursor:pointer; transition:all 0.15s; }
            .tab:hover { color:var(--primary); }
            .tab.active { border-bottom-color:var(--primary); color:var(--primary); font-weight:500; }
            @media (max-width: 960px) {
                .form-row {
                    grid-template-columns: repeat(2, 1fr);
                }
                .stat-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 768px) {
                .sidebar {
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
                    display: none;
                }
            }
            @media (max-width: 640px) {
                .header {
                    height: 56px;
                    padding: 0 16px;
                }
                .brand-title {
                    font-size: 16px;
                }
                .content {
                    padding: 16px;
                }
                .form-row {
                    grid-template-columns: 1fr;
                }
                .stat-grid {
                    grid-template-columns: 1fr;
                }
                .card {
                    padding: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header class="header">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fas fa-hand-holding-usd"></i>
                    </div>
                    <div class="brand-title">COD 限制管理</div>
                </div>
                
            </header>

            <div class="main-wrap">
                          <div id="sidebar-container"></div>
  
                <main class="content">
                    <div class="page-header">
                        <h1>拒签报表</h1>
                        <p>
                            查看各渠道会员拒签率，分析交易风险。
                        </p>
                    </div>
                    <div class="tab-bar">
                        <button class="tab active" onclick="switchTab('all')">全部</button>
                        <button class="tab" onclick="switchTab('online')">在线支付</button>
                        <button class="tab" onclick="switchTab('cod')">COD</button>
                    </div>

                    <!-- Stats -->
                    <div class="stat-grid">
                        <div class="stat">
                            <div>
                                <div class="stat-label">总会员数</div>
                                <div class="stat-value" id="statTotal">20</div>
                            </div>
                            <div class="stat-icon">
                                <i class="fas fa-users"></i>
                            </div>
                        </div>
                        <div class="stat">
                            <div>
                                <div class="stat-label">平均拒签率</div>
                                <div class="stat-value" id="statAvgRate">0%</div>
                            </div>
                            <div class="stat-icon stat-icon--warning">
                                <i class="fas fa-chart-line"></i>
                            </div>
                        </div>
                        <div class="stat">
                            <div>
                                <div class="stat-label">拒签高危 (&gt;30%)</div>
                                <div class="stat-value" id="statHighRisk">0</div>
                            </div>
                            <div class="stat-icon stat-icon--error">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Filter -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">筛选查询</div>
                            <button class="btn btn-sm" onclick="resetFilters()">
                                重置
                            </button>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">会员信息</label>
                                <input
                                    class="form-control"
                                    id="filterKeyword"
                                    placeholder="搜索会员ID、名称"
                                    oninput="render()"
                                />
                            </div>
                            <div class="form-group">
                                <label class="form-label">最低拒签率 (%)</label>
                                <input class="form-control" id="filterRateMin" type="number" min="0" max="100" step="0.1" placeholder="0" oninput="render()">
                            </div>
                            <div class="form-group">
                                <label class="form-label">最高拒签率 (%)</label>
                                <input class="form-control" id="filterRateMax" type="number" min="0" max="100" step="0.1" placeholder="100" oninput="render()">
                            </div>

                        </div>
                        <div
                            class="actions actions-right"
                            style="margin-top: 16px"
                        >
                            <button class="btn btn-sm" onclick="resetFilters()">
                                重置
                            </button>
                            <button
                                class="btn btn-primary btn-sm"
                                onclick="render()"
                            >
                                查询
                            </button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">会员拒签率列表</div>
                                <div class="card-desc">
                                    共 <span id="totalCount">12</span> 位会员
                                </div>
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 60px">会员ID</th>
                                        <th style="width: 120px">名称</th>
                                        <th style="width: 80px">订单数</th>
                                        <th style="width: 80px">COD订单数</th>
                                        <th style="width: 80px">拒签数</th>
                                        <th style="width: 110px">拒签率</th>
                                        
                                        <th style="width: 100px">最近订单</th>
                                        <th style="width: 140px">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                        <div
                            class="actions actions-right mt-4"
                            id="pagination"
                        ></div>
                    </div>
                </main>
            </div>
            <div class="drawer-overlay" id="drawerOverlay">
                <div class="drawer">
                    <div class="drawer-header">
                        <span>会员拒签详情</span>
                        <button class="modal-close" onclick="closeDrawer()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="drawer-body" id="drawerBody"></div>
                </div>
            </div>
        </div>

        <script>
function renderSidebar(activeId) {
  var container = document.getElementById('sidebar-container');
  if (!container) return;
  var items = [
    { id: 'fee', href: 'COD手续费.html', icon: 'fa-percent', label: 'COD手续费' },
    { id: 'rejection', href: '拒签报表.html', icon: 'fa-undo-alt', label: '拒签报表' },
    { id: 'rules', href: 'COD限制规则.html', icon: 'fa-cogs', label: 'COD限制规则' },
    { id: 'members', href: '会员管理.html', icon: 'fa-users', label: '会员列表' },
  ];
  var html = '<aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">COD \u9650\u5236</div>';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var cls = item.id === activeId ? 'sidebar-item active' : 'sidebar-item';
    html += '<a class="' + cls + '" href="' + item.href + '"><i class="fas ' + item.icon + '"></i> ' + item.label + '</a>\n        ';
  }
  html += '</div></aside>';
  container.innerHTML = html;
}

                warning: 20,
                restrict: 40,
                period: 30,
                unlockDays: 14,
            };

            const tierMap = {
                basic: "普通",
                silver: "银卡",
                gold: "金卡",
                platinum: "钻石",
            };



            const members = [
                {
                    id: 1001,

                    tier: "gold",
                    totalOrders: 28,
                    rejectedOrders: 3,
                    rejectionRate: 10.7,
                    codStatus: "normal",
                    lastOrderDate: "2026-07-05",
                    paymentMethod: "cod",
                    codOrders: 28,
                    codRejectedOrders: 3,
                },
                {
                    id: 1002,
                    name: "Abena Mensah",
                    tier: "silver",

            let currentTab = "all";
            let currentPage = 1;
            const pageSize = 10;

            function getFiltered() {
                const kw = document
                    .getElementById("filterKeyword")
                    .value.toLowerCase();
                var rateMin = parseFloat(document.getElementById("filterRateMin").value) || 0;
                var rateMax = parseFloat(document.getElementById("filterRateMax").value) || 100;
                return members.filter(function(m) {
                    if (currentTab === "cod" && m.paymentMethod !== "cod") return false;
                    if (currentTab === "online" && m.paymentMethod !== "online") return false;
                    if (kw && !m.name.toLowerCase().includes(kw) && !String(m.id).includes(kw)) return false;
                    if (m.rejectionRate < rateMin || m.rejectionRate > rateMax) return false;
                    return true;
                });
            }

            function rateColor(rate) {
                if (rate >= thresholds.restrict) return "#f5222d";
                if (rate >= thresholds.warning) return "#faad14";
                return "#52c41a";
            }

            function render() {
                const filtered = getFiltered();
                document.getElementById("totalCount").textContent =
                    filtered.length;
                document.getElementById("statTotal").textContent = filtered.length;
                var avgRate = filtered.reduce(function(s, m) { return s + m.rejectionRate; }, 0) / (filtered.length || 1);
                document.getElementById("statAvgRate").textContent = avgRate.toFixed(1) + "%";
                document.getElementById("statHighRisk").textContent = filtered.filter(function(m) { return m.rejectionRate > 30; }).length;

                const totalPages = Math.max(
                    1,
                    Math.ceil(filtered.length / pageSize),
                );
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const page = filtered.slice(start, start + pageSize);

                const tbody = document.getElementById("tableBody");
                if (page.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><div>暂无匹配的会员数据</div></div></td></tr>';
                } else {
                    tbody.innerHTML = page.map((m) => {
                        const color = rateColor(m.rejectionRate);
                        const pct = Math.round(m.rejectionRate);
                        return `<tr>
        <td style="color:var(--text-muted);font-size:13px">#${m.id}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="avatar" style="width:28px;height:28px;font-size:12px">${m.name.charAt(0)}</div><span style="font-weight:500">${esc(m.name)}</span></div></td>
        <td>${m.totalOrders}</td>
        <td>${m.codOrders}</td>
        <td>${m.rejectedOrders}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="flex:1;max-width:80px"><div class="progress-bar" style="width:${pct}%;background:${color}"></div></div><span style="font-weight:500;font-size:13px;color:${color}">${m.rejectionRate}%</span></div></td>

        <td style="color:#999;font-size:13px">${m.lastOrderDate}</td>
        <td><div class="actions" style="justify-content:flex-start">
          <button class="btn btn-text btn-xs" onclick="openDetail(${m.id})">详情</button>
        </div></td>
      </tr>`;
                    });
                }

                const pg = document.getElementById("pagination");
                if (totalPages <= 1) {
                    pg.innerHTML = "";
                    return;
                }
                let h = "";
                h += `<button ${currentPage <= 1 ? "disabled" : ""} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
                for (let i = 1; i <= totalPages; i++)
                    h +=
                        i === currentPage
                            ? `<button class="active">${i}</button>`
                            : `<button onclick="goPage(${i})">${i}</button>`;
                h += `<button ${currentPage >= totalPages ? "disabled" : ""} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
                h += `<span class="info">共 ${filtered.length} 条</span>`;
                pg.innerHTML = h;
            }

            function esc(s) {
                if (!s) return "";
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
            function goPage(p) {
                currentPage = p;
                render();
            }
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelector('.tab[onclick*="' + tab + '"]').classList.add('active');
                currentPage = 1;
                render();
            }
            function resetFilters() {
                document.getElementById("filterKeyword").value = "";
                document.getElementById("filterRateMin").value = "";
                document.getElementById("filterRateMax").value = "";

                render();
            }

            function openDetail(id) {
                const m = members.find((x) => x.id === id);
                if (!m) return;
                const color = rateColor(m.rejectionRate);
                const pct = Math.round(m.rejectionRate);
                const months = [

                    { month: "7月", rate: 27 },
                ];
                let trendHtml = months
                    .map((mon) => {
                        const c =
                            mon.rate >= thresholds.restrict
                                ? "#f5222d"
                                : mon.rate >= thresholds.warning
                                  ? "#faad14"
                                  : "#42b7ae";
                        const h = Math.max(mon.rate, 4);
                        return `<div style="flex:1;text-align:center"><div style="font-size:12px;color:#999;margin-bottom:8px">${mon.month}</div><div style="height:80px;display:flex;align-items:flex-end;justify-content:center"><div style="width:24px;height:${h}px;border-radius:4px;background:${c};min-height:4px"></div></div><div style="font-size:12px;font-weight:500;margin-top:4px;color:${c}">${mon.rate}%</div></div>`;

                    .join("");

                document.getElementById("drawerBody").innerHTML = `

      <div class="stat"><div><div class="stat-label">拒签次数</div><div class="stat-value" style="color:var(--error)">${m.rejectedOrders}</div></div><div class="stat-icon stat-icon--error"><i class="fas fa-times-circle"></i></div></div>
      <div class="stat"><div><div class="stat-label">COD 拒签次数</div><div class="stat-value" style="color:var(--error)">${m.codRejectedOrders}</div></div><div class="stat-icon stat-icon--error"><i class="fas fa-times-circle"></i></div></div>

      <div style="display:flex;gap:8px;padding:8px 0">${trendHtml}</div>
    </div>

  `;
                document.getElementById("drawerOverlay").classList.add("open");
            }

                document
