<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #42b7ae; --primary-hover: #339b94; --primary-bg: #e6f7f6;
  --bg: #f5f7fa; --card: #fff; --border: #e5e7eb; --border-soft: #f0f2f5;
  --text: #333; --text-secondary: #666; --text-muted: #999;
  --success: #52c41a; --warning: #faad14; --error: #f5222d;
  --radius-card: 12px; --radius-control: 8px; --radius-tag: 4px;
  --shadow-card: 0 1px 2px rgba(15,23,42,0.03);
  --sidebar-width: 220px; --header-height: 64px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.5; }
.shell { min-height:100vh; display:flex; flex-direction:column; }

.header { position:sticky; top:0; z-index:30; display:flex; height:var(--header-height); align-items:center; justify-content:space-between; gap:16px; padding:0 24px; border-bottom:1px solid var(--border-soft); background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); }
.brand { display:flex; align-items:center; gap:12px; }
.brand-icon { display:flex; width:32px; height:32px; align-items:center; justify-content:center; border-radius:8px; background:var(--primary); color:#fff; font-size:16px; }
.brand-title { color:#1f2937; font-size:18px; font-weight:600; }

.main-wrap { display:flex; flex:1; min-height:0; }

.sidebar { width:var(--sidebar-width); flex-shrink:0; background:#fff; border-right:1px solid var(--border-soft); padding:20px 0; position:sticky; top:var(--header-height); height:calc(100vh - var(--header-height)); overflow-y:auto; }
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
.sidebar-section { padding:0 12px; margin-bottom:24px; }
.sidebar-label { padding:4px 12px 8px; color:var(--text-muted); font-size:11px; font-weight:600; letter-spacing:0.8px; }
.sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:var(--text-secondary); font-size:14px; text-decoration:none; transition:all 0.12s; }
.sidebar-item i { width:18px; font-size:14px; text-align:center; flex-shrink:0; }
.sidebar-item:hover { background:var(--bg); color:var(--primary); }
.sidebar-item.active { background:var(--primary-bg); color:var(--primary); font-weight:500; }

.content { flex:1; min-width:0; padding:24px; }
.page-header { margin-bottom:24px; }
.page-header h1 { color:#1f2937; font-size:20px; font-weight:600; }
.page-header p { margin-top:4px; color:var(--text-muted); font-size:13px; }

.card { background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:20px; }
.card + .card { margin-top:20px; }
.card-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
.card-title { font-size:16px; font-weight:600; }
.card-desc { margin-top:4px; color:var(--text-muted); font-size:12px; }

.form-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 20px; }
.form-label { display:block; margin-bottom:6px; color:var(--text-secondary); font-size:13px; }
.form-control { width:100%; height:36px; padding:0 11px; border:1px solid var(--border); border-radius:var(--radius-control); background:#fff; color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:border-color 0.2s; }
.form-control:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(66,183,174,0.16); }
select.form-control { appearance:auto; cursor:pointer; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 16px; border-radius:var(--radius-control); font-size:14px; font-family:inherit; font-weight:500; cursor:pointer; transition:all 0.15s; white-space:nowrap; border:1px solid var(--border); background:#fff; color:var(--text); text-decoration:none; }
.btn:hover { border-color:#d1d5db; background:#fafafa; }
.btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
.btn-sm { height:32px; padding:0 12px; font-size:13px; }
.btn-xs { height:28px; padding:0 8px; font-size:12px; }

.actions { display:flex; align-items:center; gap:8px; }
.actions-right { justify-content:flex-end; }
.mt-4 { margin-top:16px; }

.table-wrap { overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-card); }
table { width:100%; min-width:950px; border-collapse:collapse; table-layout:fixed; }
table th { padding:12px 16px; background:#fafafa; border-bottom:1px solid var(--border-soft); color:var(--text-secondary); font-size:13px; font-weight:500; text-align:left; }
table td { padding:12px 16px; border-bottom:1px solid #f5f5f5; color:var(--text); font-size:13px; vertical-align:middle; }
table tbody tr:last-child td { border-bottom:0; }
table tr:hover td { background:#fafafa; }

.tag { display:inline-flex; height:22px; align-items:center; padding:0 8px; border-radius:var(--radius-tag); font-size:12px; font-weight:500; line-height:20px; white-space:nowrap; }
.tag-success { background:#f0faf0; color:var(--success); }
.tag-default { background:#f5f5f5; color:var(--text-secondary); }
.tag-warning { background:#fff7e6; color:var(--warning); }
.tag-error { background:#fff1f0; color:var(--error); }
.tag-primary { background:var(--primary-bg); color:var(--primary); }

.pagination { display:flex; align-items:center; justify-content:flex-end; gap:4px; }
.pagination button { display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:32px; padding:0 6px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font-size:13px; cursor:pointer; }
.pagination button:hover { border-color:var(--primary); color:var(--primary); }
.pagination button.active { background:var(--primary); border-color:var(--primary); color:#fff; }
.pagination button:disabled { opacity:0.4; cursor:default; }
.pagination .info { margin-left:12px; color:var(--text-muted); font-size:13px; }

/* Drawer */
.drawer-overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.3); }
.modal-overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { width:720px; max-width:calc(100vw - 40px); max-height:calc(100vh - 40px); background:#fff; border-radius:var(--radius-card); box-shadow:0 20px 60px rgba(15,23,42,0.18); display:flex; flex-direction:column; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 0; font-size:16px; font-weight:600; }
.modal-close { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border:none; background:none; border-radius:6px; color:var(--text-muted); font-size:16px; cursor:pointer; }
.modal-close:hover { background:var(--bg); color:var(--text); }
.modal-body { padding:20px 24px; overflow-y:auto; flex:1; }
.modal-footer { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:12px 24px; border-top:1px solid var(--border-soft); }
.drawer-overlay.open { display:flex; justify-content:flex-end; }
.drawer { width:540px; max-width:calc(100vw - 40px); height:100vh; background:#fff; box-shadow:-4px 0 20px rgba(0,0,0,0.08); display:flex; flex-direction:column; }
.drawer-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border-soft); font-size:16px; font-weight:600; }
.drawer-body { padding:24px; overflow-y:auto; flex:1; }

.avatar { width:40px; height:40px; border-radius:50%; background:var(--primary-bg); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; flex-shrink:0; }

.stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:20px; }
.stat { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border:1px solid var(--border-soft); border-radius:var(--radius-card); background:#fff; }
.stat-label { color:var(--text-muted); font-size:12px; }
.stat-value { margin-top:4px; color:#1f2937; font-size:22px; font-weight:600; line-height:1.2; }
.stat-icon { display:flex; width:36px; height:36px; align-items:center; justify-content:center; border-radius:8px; background:var(--primary-bg); color:var(--primary); font-size:16px; flex-shrink:0; }
.stat-icon--error { background:#fff1f0; color:var(--error); }
.stat-icon--success { background:#f0faf0; color:var(--success); }
.stat-icon--warning { background:#fff7e6; color:var(--warning); }

.empty-state { padding:48px 20px; color:var(--text-muted); text-align:center; }
.empty-state i { margin-bottom:12px; color:#d0d5dd; font-size:40px; }

@media (max-width:960px) { .form-row { grid-template-columns:repeat(2,1fr); } }
@media (max-width:768px) { .sidebar { display:none; } }
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
@media (max-width:640px) { .header { height:56px; padding:0 16px; } .brand-title { font-size:16px; } .content { padding:16px; } .form-row { grid-template-columns:1fr; } .card { padding:16px; } }
</style>
</head>
<body>
<div class="shell">

  <header class="header">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-hand-holding-usd"></i></div>
      <div class="brand-title">COD 限制管理</div>
    </div>
  </header>

  <div class="main-wrap">
              <div id="sidebar-container"></div>
  
    <main class="content">
      <div class="page-header">
        <h1>会员列表</h1>
        <p>查看与管理平台注册会员信息及 COD 使用状态。</p>
      </div>

      <!-- Filter -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">会员信息</div>
          <button class="btn btn-sm" onclick="resetFilters()">重置</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">会员ID/昵称</label>
            <input class="form-control" id="filterKeyword" placeholder="请输入" oninput="render()">
          </div>
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input class="form-control" id="filterPhone" placeholder="请输入" oninput="render()">
          </div>
          <div class="form-group">
            <label class="form-label">注册日期</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input class="form-control" id="filterDateStart" type="date" onchange="render()" style="flex:1">
              <span style="color:var(--text-muted)">-</span>
              <input class="form-control" id="filterDateEnd" type="date" onchange="render()" style="flex:1">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">注册平台</label>
            <select class="form-control" id="filterPlatform" onchange="render()">
              <option value="">请选择</option>
              <option value="h5">H5</option>
              <option value="ios">iOS</option>
              <option value="android">Android</option>
            </select>
          </div>
        </div>
        <div class="actions actions-right" style="margin-top:16px">
          <button class="btn btn-sm" onclick="resetFilters()">重置</button>
          <button class="btn btn-primary btn-sm" onclick="render()">查询</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">会员列表</div>
            <div class="card-desc">共 <span id="totalCount">10</span> 位会员</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:140px">会员ID</th>
                <th style="width:80px">昵称</th>
                <th style="width:110px">账号</th>
                <th style="width:60px">平台</th>
                <th style="width:115px">注册时间</th>
                <th style="width:115px">最后登录</th>
                <th style="width:60px">状态</th>
                <th style="width:80px">COD 状态</th>
                <th style="width:130px">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="actions actions-right mt-4" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- Detail Drawer -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer">
      <div class="drawer-header">
        <span>会员详情</span>
        <button class="modal-close" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

</div>

  <!-- Restrict Modal -->
  <div class="modal-overlay" id="restrictModal">
    <div class="modal" style="width:420px">
      <div class="modal-header">
        <span>限制 COD 使用</span>
        <button class="modal-close" onclick="closeRestrictModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">会员</label>
          <div id="restrictMemberName" style="font-weight:500;padding:4px 0;font-size:14px"></div>
        </div>
        <div class="form-group" style="margin-top:4px">
          <label class="form-label">限制期限</label>
          <select class="form-control" id="restrictModalPeriod">
            <option value="7">7天</option>
            <option value="14">14天</option>
            <option value="30" selected>30天</option>
            <option value="90">90天</option>
            <option value="0">永久</option>
          </select>
        </div>
        <div class="form-group" style="margin-top:8px">
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer">
            <input type="checkbox" id="restrictModalAutoUnlock" checked style="width:16px;height:16px">
            允许根据 COD 规则自动解除
          </label>
          <div class="form-help" style="margin-top:4px">勾选后，当该会员拒签率等条件恢复正常时，系统可自动解除此限制</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" onclick="closeRestrictModal()">取消</button>
        <button class="btn btn-primary btn-sm" style="background:var(--error);border-color:var(--error)" onclick="confirmRestrict()">确认限制</button>
      </div>
    </div>
  </div>

<script>
function renderSidebar(activeId) {
  var container = document.getElementById('sidebar-container');
  if (!container) return;
  var items = [
    { id: 'fee', href: 'COD手续费.html', icon: 'fa-percent', label: 'COD手续费' },
    { id: 'rejection', href: '拒签报表.html', icon: 'fa-undo-alt', label: '拒签报表' },
    { id: 'rules', href: 'COD限制规则.html', icon: 'fa-cogs', label: 'COD限制规则' },
    { id: 'members', href: '会员管理.html', icon: 'fa-users', label: '会员列表' },
  ];
  var html = '<aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">COD \u9650\u5236</div>';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var cls = item.id === activeId ? 'sidebar-item active' : 'sidebar-item';
    html += '<a class="' + cls + '" href="' + item.href + '"><i class="fas ' + item.icon + '"></i> ' + item.label + '</a>\n        ';
  }
  html += '</div></aside>';
  container.innerHTML = html;
}


const members = [
  { id:'1122858408563703808', nick:'3873hQD2', account:'535770090', platform:'h5', createdAt:'2026-06-26 03:58:26', lastLogin:'2026-06-29 01:10:43', status:'active', codStatus:'normal', totalOrders:28, rejectedOrders:3, rejectionRate:10.7 },
  { id:'1118916847241003008', nick:'dAa8fx7Y', account:'456655656', platform:'h5', createdAt:'2026-06-15 06:56:06', lastLogin:'2026-06-15 06:56:08', status:'active', codStatus:'normal', totalOrders:15, rejectedOrders:2, rejectionRate:13.3 },
  { id:'1118913074019958784', nick:'9n7S8HFL', account:'123456789999', platform:'h5', createdAt:'2026-06-15 06:41:07', lastLogin:'2026-06-15 06:43:14', status:'active', codStatus:'normal', totalOrders:10, rejectedOrders:1, rejectionRate:10.0 },
  { id:'1114479508284506112', nick:'998h6660', account:'12345678909', platform:'h5', createdAt:'2026-06-03 01:03:40', lastLogin:'2026-07-06 01:21:31', status:'active', codStatus:'warning', totalOrders:22, rejectedOrders:6, rejectionRate:27.3 },
  { id:'1092136806868058112', nick:'d00CD6EJ', account:'yo@qq.com', platform:'ios', createdAt:'2026-04-02 09:21:45', lastLogin:'2026-04-02 09:23:13', status:'active', codStatus:'normal', totalOrders:45, rejectedOrders:3, rejectionRate:6.7 },
  { id:'1092136487991902208', nick:'p242LX95', account:'1234502', platform:'ios', createdAt:'2026-04-02 09:20:29', lastLogin:'2026-04-02 09:21:23', status:'active', codStatus:'restricted', totalOrders:8, rejectedOrders:4, rejectionRate:50.0 , restrictSource:'auto', autoUnlock:true},
  { id:'1092135588317888512', nick:'w14Ngs3D', account:'1234502', platform:'ios', createdAt:'2026-04-02 09:16:55', lastLogin:'2026-04-02 09:17:16', status:'inactive', codStatus:'normal', totalOrders:0, rejectedOrders:0, rejectionRate:0 },
  { id:'1092134690904604672', nick:'36782soK', account:'yo@qq.com', platform:'android', createdAt:'2026-04-02 09:13:21', lastLogin:'2026-04-02 09:13:44', status:'inactive', codStatus:'warning', totalOrders:6, rejectedOrders:2, rejectionRate:33.3 },
  { id:'1092133837992886272', nick:'833CHe9n', account:'yo@qq.com', platform:'android', createdAt:'2026-04-02 09:09:57', lastLogin:'2026-04-02 09:11:14', status:'inactive', codStatus:'normal', totalOrders:5, rejectedOrders:3, rejectionRate:60.0 },
  { id:'1092131958328131584', nick:'DW6r7AY2', account:'1234502', platform:'android', createdAt:'2026-04-02 09:02:29', lastLogin:'2026-04-02 09:02:55', status:'inactive', codStatus:'restricted', totalOrders:3, rejectedOrders:2, rejectionRate:66.7 , restrictSource:'manual', restrictDays:30, autoUnlock:true},
];

const platformMap = { h5:'H5', ios:'iOS', android:'Android' };
const codStatusLabel = { normal:'正常', warning:'警告', restricted:'已限制' };
const codStatusClass = { normal:'tag-success', warning:'tag-warning', restricted:'tag-error' };

let currentPage = 1;
const pageSize = 10;

function getFiltered() {
  const kw = document.getElementById('filterKeyword').value.toLowerCase();
  const phone = document.getElementById('filterPhone').value;
  const ds = document.getElementById('filterDateStart').value;
  const de = document.getElementById('filterDateEnd').value;
  const pf = document.getElementById('filterPlatform').value;
  return members.filter(m => {
    if (kw && !m.id.includes(kw) && !m.nick.toLowerCase().includes(kw)) return false;
    if (phone && !m.account.includes(phone)) return false;
    if (pf && m.platform !== pf) return false;
    if (ds && m.createdAt < ds) return false;
    if (de && m.createdAt > de + ' 23:59:59') return false;
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  document.getElementById('totalCount').textContent = filtered.length;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage-1)*pageSize;
  const page = filtered.slice(start, start+pageSize);

  const tbody = document.getElementById('tableBody');
  if (page.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><i class="fas fa-inbox"></i><div>暂无匹配的会员数据</div></div></td></tr>';
  } else {
    tbody.innerHTML = page.map(m => {
      const codCls = codStatusClass[m.codStatus] || 'tag-default';
      const codLbl = codStatusLabel[m.codStatus] || m.codStatus;
      let codLblFinal = m.restrictDays ? codLbl + '(' + m.restrictDays + '天)' : (m.codStatus === 'restricted' ? codLbl + '(永久)' : codLbl);
      const srcLbl = m.restrictSource ? (m.restrictSource === 'manual' ? '手动' : '自动') : '';
      let btns = '<button class="btn btn-text btn-xs" onclick="openDetail(\''+m.id+'\')">详情</button>';
      if (m.codStatus === 'restricted') btns += '<button class="btn btn-text btn-xs" style="color:var(--success)" onclick="unrestrict(\''+m.id+'\')">解除限制</button>';
      else btns += '<button class="btn btn-text btn-xs" style="color:var(--warning)" onclick="openRestrictModal(\''+m.id+'\')">限制COD</button>';
      return `<tr>
        <td style="font-family:monospace;font-size:12px">${m.id}</td>
        <td>${esc(m.nick)}</td>
        <td>${esc(m.account)}</td>
        <td><span class="tag tag-default">${platformMap[m.platform]}</span></td>
        <td style="color:var(--text-secondary);font-size:12px">${m.createdAt}</td>
        <td style="color:var(--text-secondary);font-size:12px">${m.lastLogin}</td>
        <td><span class="tag ${m.status==='active'?'tag-success':'tag-default'}">${m.status==='active'?'启用':'未激活'}</span></td>
        <td><span class="tag ${codCls}">${codLblFinal}</span>${srcLbl ? '&nbsp;<span style="font-size:11px;color:var(--text-muted)">(' + srcLbl + ')</span>' : ''}</td>
        <td><div class="actions" style="justify-content:flex-start">${btns}</div></td>
      </tr>`;
    });
  }

  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  let h = '';
  h += `<button ${currentPage<=1?'disabled':''} onclick="goPage(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
  for (let i=1; i<=totalPages; i++) h += i===currentPage ? `<button class="active">${i}</button>` : `<button onclick="goPage(${i})">${i}</button>`;
  h += `<button ${currentPage>=totalPages?'disabled':''} onclick="goPage(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
  h += `<span class="info">共 ${filtered.length} 条</span>`;
  pg.innerHTML = h;
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function goPage(p) { currentPage = p; render(); }
function resetFilters() {
  ['filterKeyword','filterPhone','filterDateStart','filterDateEnd','filterPlatform'].forEach(id => document.getElementById(id).value='');
  currentPage = 1; render();
}

function openDetail(id) {
  const m = members.find(x => x.id === id);
  if (!m) return;
  const codCls = codStatusClass[m.codStatus] || 'tag-default';
  const codLbl = codStatusLabel[m.codStatus] || m.codStatus;
  document.getElementById('drawerBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div class="avatar">${m.nick.charAt(0)}</div>
      <div><div style="font-weight:600;font-size:16px">${esc(m.nick)}</div><div style="color:#999;font-size:13px">会员ID: ${m.id}</div></div>
      <div style="margin-left:auto"><span class="tag ${codCls}">${codLbl}</span></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div><div class="stat-label">账号</div><div class="stat-value" style="font-size:18px">${esc(m.account)}</div></div><div class="stat-icon"><i class="fas fa-user"></i></div></div>
      <div class="stat"><div><div class="stat-label">注册平台</div><div class="stat-value" style="font-size:18px">${platformMap[m.platform]}</div></div><div class="stat-icon"><i class="fas fa-mobile-alt"></i></div></div>
      <div class="stat"><div><div class="stat-label">注册时间</div><div class="stat-value" style="font-size:18px">${m.createdAt}</div></div><div class="stat-icon"><i class="fas fa-calendar-plus"></i></div></div>
      <div class="stat"><div><div class="stat-label">最后登录</div><div class="stat-value" style="font-size:18px">${m.lastLogin}</div></div><div class="stat-icon"><i class="fas fa-clock"></i></div></div>
    </div>
    <div style="border-top:1px solid var(--border-soft);padding-top:20px;margin-bottom:16px">
      <div style="font-weight:600;font-size:15px;margin-bottom:12px">COD 使用数据</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div><div class="stat-label">COD 订单数</div><div class="stat-value">${m.totalOrders||0}</div></div><div class="stat-icon"><i class="fas fa-shopping-cart"></i></div></div>
      <div class="stat"><div><div class="stat-label">拒签次数</div><div class="stat-value" style="color:var(--error)">${m.rejectedOrders||0}</div></div><div class="stat-icon stat-icon--error"><i class="fas fa-times-circle"></i></div></div>
      <div class="stat"><div><div class="stat-label">拒签率</div><div class="stat-value">${m.rejectionRate||0}%</div></div><div class="stat-icon"><i class="fas fa-chart-line"></i></div></div>
      <div class="stat"><div><div class="stat-label">COD 状态</div><div class="stat-value" style="font-size:18px"><span class="tag ${codCls}">${codLbl}</span>${m.restrictSource ? '<br><span style="font-size:12px;color:var(--text-muted);line-height:1.6">' + (m.restrictSource==='manual'?'手动限制，需手动解除' : '系统自动限制') + '</span>' : ''}</div></div><div class="stat-icon"><i class="fas fa-ban"></i></div></div>
    </div>
    <div class="actions actions-right" style="margin-top:20px">
      ${m.codStatus === 'restricted' ? '<div style="display:flex;align-items:center;justify-content:space-between;width:100%"><div><div style="font-size:13px;color:var(--text-muted)">限制期限</div><div style="font-weight:500;margin-top:2px">' + (m.restrictDays ? m.restrictDays+'天' : '永久') + '</div>' + (m.autoUnlock ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">允许系统自动解除</div>' : '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">禁止系统自动解除</div>') + '</div></div><button class="btn btn-sm" style="background:var(--success);border-color:var(--success);color:#fff" onclick="unrestrict(\'"+m.id+"\')"><i class="fas fa-check"></i> 解除 COD 限制</button></div>' : '<div style="display:flex;gap:12px;align-items:end;width:100%"><div style="flex:1"><label class="form-label" style="margin-bottom:6px">限制期限</label><select class="form-control" id="restrictPeriodSelect"><option value="7">7天</option><option value="14">14天</option><option value="30" selected>30天</option><option value="90">90天</option><option value="0">永久</option></select></div><button class="btn btn-primary btn-sm" style="background:var(--error);border-color:var(--error);height:36px;white-space:nowrap" onclick="restrictWithPeriod(\'"+m.id+"\')">限制 COD 使用</button></div><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-top:4px"><input type="checkbox" id="restrictAutoUnlock" checked>允许 COD 规则系统自动解除</label></div>'}
    </div>
  `;
  document.getElementById('drawerOverlay').classList.add('open');
}

function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('open'); }

function restrict(id, days, autoUnlock) {
  const m = members.find(x => x.id === id);
  if (m) {
    m.codStatus = 'restricted';
    m.restrictSource = 'manual';
    m.restrictDays = (days && days > 0) ? days : null;
    m.autoUnlock = autoUnlock !== undefined ? autoUnlock : true;
    render();
    closeDrawer();
  }
}

function unrestrict(id) {
  const m = members.find(x => x.id === id);
  if (m) { m.codStatus = 'normal'; m.restrictSource = null; m.restrictDays = null; render(); closeDrawer(); }
}


let restrictTargetId = null;

function openRestrictModal(id) {
  restrictTargetId = id;
  const m = members.find(x => x.id === id);
  if (!m) return;
  document.getElementById('restrictMemberName').textContent = m.nick + ' (' + m.account + ')';
  document.getElementById('restrictModalPeriod').value = 30;
  document.getElementById('restrictModalAutoUnlock').checked = true;
  document.getElementById('restrictModal').classList.add('open');
}

function closeRestrictModal() {
  document.getElementById('restrictModal').classList.remove('open');
  restrictTargetId = null;
}

function confirmRestrict() {
  if (!restrictTargetId) return;
  const days = parseInt(document.getElementById('restrictModalPeriod').value);
  const autoUnlock = document.getElementById('restrictModalAutoUnlock').checked;
  restrict(restrictTargetId, days > 0 ? days : null, autoUnlock);
  closeRestrictModal();
}
function restrictWithPeriod(id) {
  const days = parseInt(document.getElementById('restrictPeriodSelect').value);
  const autoUnlock = document.getElementById('restrictAutoUnlock') ? document.getElementById('restrictAutoUnlock').checked : true;
  restrict(id, days > 0 ? days : null, autoUnlock);
}

renderSidebar("members");
render();
</script>
</body>
</html>
