<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>COD手续费</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            :root {
                --primary: #42b7ae;
                --primary-hover: #339b94;
                --primary-bg: #e6f7f6;
                --bg: #f5f7fa;
                --card: #fff;
                --border: #e5e7eb;
                --border-soft: #f0f2f5;
                --text: #333;
                --text-secondary: #666;
                --text-muted: #999;
                --success: #52c41a;
                --warning: #faad14;
                --error: #f5222d;
                --radius-card: 12px;
                --radius-control: 8px;
                --radius-tag: 4px;
                --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.03);
                --sidebar-width: 220px;
                --header-height: 64px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                font-size: 14px;
                line-height: 1.5;
            }
            .shell {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Header */
            .header {
                position: sticky;
                top: 0;
                z-index: 30;
                display: flex;
                height: var(--header-height);
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 0 24px;
                border-bottom: 1px solid var(--border-soft);
                background: rgba(255, 255, 255, 0.96);
                backdrop-filter: blur(10px);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .brand-icon {
                display: flex;
                width: 32px;
                height: 32px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background: var(--primary);
                color: #fff;
                font-size: 16px;
            }
            .brand-title {
                color: #1f2937;
                font-size: 18px;
                font-weight: 600;
            }

            /* Layout */
            .main-wrap {
                display: flex;
                flex: 1;
                min-height: 0;
            }

            /* Sidebar */
            .sidebar {
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
                width: var(--sidebar-width);
                flex-shrink: 0;
                background: #fff;
                border-right: 1px solid var(--border-soft);
                padding: 20px 0;
                position: sticky;
                top: var(--header-height);
                height: calc(100vh - var(--header-height));
                overflow-y: auto;
            }
            .sidebar-section {
                padding: 0 12px;
                margin-bottom: 24px;
            }
            .sidebar-label {
                padding: 4px 12px 8px;
                color: var(--text-muted);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.8px;
            }
            .sidebar-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
                border-radius: 8px;
                color: var(--text-secondary);
                font-size: 14px;
                text-decoration: none;
                transition: all 0.12s;
            }
            .sidebar-item i {
                width: 18px;
                font-size: 14px;
                text-align: center;
                flex-shrink: 0;
            }
            .sidebar-item:hover {
                background: var(--bg);
                color: var(--primary);
            }
            .sidebar-item.active {
                background: var(--primary-bg);
                color: var(--primary);
                font-weight: 500;
            }
            .sidebar-item .badge {
                margin-left: auto;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 20px;
                height: 18px;
                padding: 0 6px;
                border-radius: 9px;
                background: var(--primary);
                color: #fff;
                font-size: 11px;
                line-height: 18px;
            }

            /* Content */
            .content {
                flex: 1;
                min-width: 0;
                padding: 24px;
            }
            .page-header {
                margin-bottom: 24px;
            }
            .page-header h1 {
                color: #1f2937;
                font-size: 20px;
                font-weight: 600;
            }
            .page-header p {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 13px;
            }

            /* Card */
            .card {
                background: var(--card);
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
                box-shadow: var(--shadow-card);
                padding: 20px;
            }
            .card + .card {
                margin-top: 20px;
            }
            .card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 16px;
            }
            .card-title {
                font-size: 16px;
                font-weight: 600;
            }
            .card-desc {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 12px;
            }

            /* Form */
            .form-row {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px 20px;
            }
            .form-row-3 {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px 20px;
            }
            .form-row-2 {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px 20px;
            }
            .form-group {
            .form-row-2 {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px 20px;
            }
            }
            .form-label {
                display: block;
                margin-bottom: 6px;
                color: var(--text-secondary);
                font-size: 13px;
            }
            .form-control {
                width: 100%;
                height: 36px;
                padding: 0 11px;
                border: 1px solid var(--border);
                border-radius: var(--radius-control);
                background: #fff;
                color: var(--text);
                font-size: 14px;
                font-family: inherit;
                outline: none;
                transition: border-color 0.2s;
            }
            .form-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(66, 183, 174, 0.16);
            }
            select.form-control {
                appearance: auto;
                cursor: pointer;
            }
            textarea.form-control {
                height: auto;
                padding: 8px 11px;
                resize: vertical;
            }
            .form-help {
                margin-top: 4px;
                color: var(--text-muted);
                font-size: 12px;
            }

            /* Buttons */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 36px;
                padding: 0 16px;
                border-radius: var(--radius-control);
                font-size: 14px;
                font-family: inherit;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                white-space: nowrap;
                border: 1px solid var(--border);
                background: #fff;
                color: var(--text);
                text-decoration: none;
            }
            .btn:hover {
                border-color: #d1d5db;
                background: #fafafa;
            }
            .btn-primary {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }
            .btn-primary:hover {
                background: var(--primary-hover);
                border-color: var(--primary-hover);
            }
            .btn-text {
                height: auto;
                padding: 4px 8px;
                border: none;
                background: none;
                color: var(--primary);
                font-weight: 400;
            }
            .btn-text:hover {
                background: var(--primary-bg);
            }
            .btn-danger {
                color: var(--error);
            }
            .btn-sm {
                height: 32px;
                padding: 0 12px;
                font-size: 13px;
            }
            .btn-xs {
                height: 28px;
                padding: 0 8px;
                font-size: 12px;
            }

            /* Action bar */
            .actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .actions-right {
                justify-content: flex-end;
            }
            .actions-center {
                justify-content: center;
            }
            .mt-4 {
                margin-top: 16px;
            }

            /* Table */
            .table-wrap {
                overflow-x: auto;
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
            }
            table {
                width: 100%;
                min-width: 800px;
                border-collapse: collapse;
                table-layout: fixed;
            }
            table th {
                padding: 12px 16px;
                background: #fafafa;
                border-bottom: 1px solid var(--border-soft);
                color: var(--text-secondary);
                font-size: 13px;
                font-weight: 500;
                text-align: left;
            }
            table td {
                padding: 12px 16px;
                border-bottom: 1px solid #f5f5f5;
                color: var(--text);
                font-size: 14px;
                vertical-align: middle;
            }
            table tbody tr:last-child td {
                border-bottom: 0;
            }
            table tr:hover td {
                background: #fafafa;
            }

            /* Tag */
            .tag {
                display: inline-flex;
                height: 22px;
                align-items: center;
                padding: 0 8px;
                border-radius: var(--radius-tag);
                font-size: 12px;
                font-weight: 500;
                line-height: 20px;
                white-space: nowrap;
            }
            .tag-default {
                background: #f5f5f5;
                color: var(--text-secondary);
            }
            .tag-primary {
                background: var(--primary-bg);
                color: var(--primary);
            }
            .tag-success {
                background: #f0faf0;
                color: var(--success);
            }
            .tag-warning {
                background: #fff7e6;
                color: var(--warning);
            }
            .tag-error {
                background: #fff1f0;
                color: var(--error);
            }

            /* Stat grid */
            .stat-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                margin-bottom: 24px;
            }
            .stat {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 18px 20px;
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-card);
                background: #fff;
            }
            .stat-label {
                color: var(--text-muted);
                font-size: 12px;
            }
            .stat-value {
                margin-top: 4px;
                color: #1f2937;
                font-size: 24px;
                font-weight: 600;
                line-height: 1.2;
            }
            .stat-icon {
                display: flex;
                width: 40px;
                height: 40px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background: var(--primary-bg);
                color: var(--primary);
                font-size: 18px;
                flex-shrink: 0;
            }

            /* Pagination */
            .pagination {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 4px;
            }
            .pagination button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 32px;
                height: 32px;
                padding: 0 6px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: #fff;
                color: var(--text);
                font-size: 13px;
                cursor: pointer;
            }
            .pagination button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .pagination button.active {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }
            .pagination button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .pagination .info {
                margin-left: 12px;
                color: var(--text-muted);
                font-size: 13px;
            }

            /* Modal */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 100;
                background: rgba(0, 0, 0, 0.4);
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.open {
                display: flex;
            }
            .modal {
                width: 640px;
                max-width: calc(100vw - 40px);
                max-height: calc(100vh - 40px);
                background: #fff;
                border-radius: var(--radius-card);
                box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
                display: flex;
                flex-direction: column;
            }
            .modal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px 0;
                font-size: 16px;
                font-weight: 600;
            }
            .modal-close {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border: none;
                background: none;
                border-radius: 6px;
                color: var(--text-muted);
                font-size: 16px;
                cursor: pointer;
            }
            .modal-close:hover {
                background: var(--bg);
                color: var(--text);
            }
            .modal-body {
                padding: 20px 24px;
                overflow-y: auto;
                flex: 1;
            }
            .modal-footer {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                padding: 12px 24px;
                border-top: 1px solid var(--border-soft);
            }

            /* Empty */
            .empty-state {
                padding: 48px 20px;
                color: var(--text-muted);
                text-align: center;
            }
            .empty-state i {
                margin-bottom: 12px;
                color: #d0d5dd;
                font-size: 40px;
            }

            /* Responsive */
            @media (max-width: 960px) {
                .form-row {
                    grid-template-columns: repeat(2, 1fr);
                }
                .form-row-3 {
                    grid-template-columns: repeat(2, 1fr);
                }
                .stat-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 768px) {
                .sidebar {
#sidebar-container { width: var(--sidebar-width); flex-shrink: 0; }
                    display: none;
                }
            }
            @media (max-width: 640px) {
                .header {
                    height: 56px;
                    padding: 0 16px;
                }
                .brand-title {
                    font-size: 16px;
                }
                .content {
                    padding: 16px;
                }
                .page-header {
                    flex-direction: column;
                }
                .form-row,
                .form-row-3 {
                    grid-template-columns: 1fr;
                }
                .stat-grid {
                    grid-template-columns: 1fr;
                }
                .card {
                    padding: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <!-- Header -->
            <header class="header">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fas fa-hand-holding-usd"></i>
                    </div>
                    <div class="brand-title">COD 限制管理</div>
                </div>
            </header>

            <!-- Main -->
            <div class="main-wrap">
                <!-- Sidebar -->
                          <div id="sidebar-container"></div>
  
                <!-- Content -->
                <main class="content">
                    <div class="page-header">
                        <h1>COD手续费</h1>
                        <p>
                            管理向会员收取的 COD
                            服务手续费，支持按比例或固定金额计费。
                        </p>
                    </div>

                    <!-- Filter -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">筛选查询</div>
                            <button class="btn btn-sm" onclick="resetFilters()">
                                重置
                            </button>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">规则名称</label>
                                <input
                                    class="form-control"
                                    id="filterKeyword"
                                    placeholder="搜索规则名称"
                                    oninput="applyFilters()"
                                />
                            </div>
                            <div class="form-group">
                                <label class="form-label">计费类型</label>
                                <select
                                    class="form-control"
                                    id="filterFeeType"
                                    onchange="applyFilters()"
                                >
                                    <option value="">全部类型</option>
                                    <option value="percentage">
                                        按比例 (%)
                                    </option>
                                    <option value="fixed">固定金额</option>
                                    <option value="mixed">混合计费</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">状态</label>
                                <select
                                    class="form-control"
                                    id="filterStatus"
                                    onchange="applyFilters()"
                                >
                                    <option value="">全部状态</option>
                                    <option value="active">启用</option>
                                    <option value="inactive">停用</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">适用范围</label>
                                <select
                                    class="form-control"
                                    id="filterScope"
                                    onchange="applyFilters()"
                                >
                                    <option value="">全部范围</option>
                                    <option value="all">全部商品</option>
                                    <option value="category">按分类</option>
                                    <option value="member_tier">
                                        按会员等级
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div
                            class="actions actions-right"
                            style="margin-top: 16px"
                        >
                            <button class="btn btn-sm" onclick="resetFilters()">
                                重置
                            </button>
                            <button
                                class="btn btn-primary btn-sm"
                                onclick="applyFilters()"
                            >
                                查询
                            </button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">COD手续费</div>
                                <div class="card-desc">
                                    共 <span id="totalCount">5</span> 条规则
                                </div>
                            </div>
                            <button
                                class="btn btn-primary btn-sm"
                                onclick="openModal()"
                            >
                                <i class="fas fa-plus"></i> 新建规则
                            </button>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 160px">规则名称</th>
                                        <th style="width: 100px">计费类型</th>
                                        <th style="width: 100px">
                                            费率 / 金额
                                        </th>
                                        <th style="width: 110px">
                                            最低订单金额
                                        </th>
                                        <th style="width: 110px">
                                            最高订单金额
                                        </th>
                                        <th style="width: 100px">适用范围</th>
                                        <th style="width: 70px">状态</th>
                                        <th style="width: 110px">创建时间</th>
                                        <th style="width: 120px">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                        <div
                            class="actions actions-right mt-4"
                            id="pagination"
                        ></div>
                    </div>
                </main>
            </div>

            <!-- Modal -->
            <div class="modal-overlay" id="modalOverlay">
                <div class="modal">
                    <div class="modal-header">
                        <span id="modalTitle">新建COD手续费</span>
                        <button class="modal-close" onclick="closeModal()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-row-3">
                            <div class="form-group">
                                <label class="form-label">规则名称 <span style="color:var(--error)">*</span></label>
                                <input class="form-control" id="formName" placeholder="如：标准COD手续费" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">计费类型 <span style="color:var(--error)">*</span></label>
                                <select class="form-control" id="formFeeType" onchange="onFeeTypeChange()">
                                    <option value="percentage">按比例 (%)</option>
                                    <option value="fixed">固定金额</option>
                                    <option value="mixed">混合计费</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">币种</label>
                                <select class="form-control" id="formCurrency">
                                    <option value="GHS">GHS</option>
                                    <option value="NGN">NGN</option>
                                    <option value="KES">KES</option>
                                    <option value="USD">USD</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row-3" id="feeValueRow">
                            <div class="form-group" id="percentGroup">
                                <label class="form-label">比例费率 (%) <span style="color:var(--error)">*</span></label>
                                <input class="form-control" id="formPercent" type="number" step="0.1" min="0" max="100" placeholder="如 2.5" />
                            </div>
                            <div class="form-group" id="fixedGroup" style="display:none">
                                <label class="form-label">固定金额 <span style="color:var(--error)">*</span></label>
                                <input class="form-control" id="formFixed" type="number" step="0.5" min="0" placeholder="如 5.00" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">最低订单金额</label>
                                <input class="form-control" id="formMinOrder" type="number" min="0" step="10" placeholder="不限制留空" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">最高订单金额</label>
                                <input class="form-control" id="formMaxOrder" type="number" min="0" step="10" placeholder="不限制留空" />
                            </div>
                        </div>
                        <!-- 适用范围 -->
                        <div class="form-row-2" style="grid-template-columns: 250px 1fr">
                            <div class="form-group">
                                <label class="form-label">适用范围 <span style="color:var(--error)">*</span></label>
                                <select class="form-control" id="formScope" onchange="onScopeChange()">
                                    <option value="all">全部商品</option>
                                    <option value="category">按商品分类</option>
                                    <option value="member_tier">按会员等级</option>
                                </select>
                            </div>
                            <div class="form-group" id="scopeValueGroup" style="display:none">
                                <label class="form-label" id="scopeValueLabel">商品分类</label>
                                <select class="form-control" id="formScopeValue" multiple style="height:80px"></select>
                            </div>
                        </div>
                        <!-- 状态 + 规则说明 -->
                        <div class="form-row-2" style="grid-template-columns: 250px 1fr">
                            <div class="form-group">
                                <label class="form-label">状态</label>
                                <select class="form-control" id="formStatus">
                                    <option value="active">启用</option>
                                    <option value="inactive">停用</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">规则说明</label>
                                <textarea class="form-control" id="formDesc" rows="2" placeholder="对该规则的简要说明（选填）"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        <script>
function renderSidebar(activeId) {
  var container = document.getElementById('sidebar-container');
  if (!container) return;
  var items = [
    { id: 'fee', href: 'COD手续费.html', icon: 'fa-percent', label: 'COD手续费' },
    { id: 'rejection', href: '拒签报表.html', icon: 'fa-undo-alt', label: '拒签报表' },
    { id: 'rules', href: 'COD限制规则.html', icon: 'fa-cogs', label: 'COD限制规则' },
    { id: 'members', href: '会员管理.html', icon: 'fa-users', label: '会员列表' },
  ];
  var html = '<aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">COD \u9650\u5236</div>';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var cls = item.id === activeId ? 'sidebar-item active' : 'sidebar-item';
    html += '<a class="' + cls + '" href="' + item.href + '"><i class="fas ' + item.icon + '"></i> ' + item.label + '</a>\n        ';
  }
  html += '</div></aside>';
  container.innerHTML = html;
}


            // ===== Data =====
            let rules = [
    { id:1, name:'标准COD手续费', desc:'适用于全部商品的标准费率', feeType:'percentage', currency:'GHS', feeValue:2.5, feeValuePercent:2.5, feeValueFixed:null, minOrder:null, maxOrder:5000, scope:'all', scopeValue:[], status:'active', createdAt:'2026-06-01' },
    { id:2, name:'高价值商品费率', desc:'针对高价值订单的固定手续费', feeType:'fixed', currency:'GHS', feeValue:15, feeValuePercent:null, feeValueFixed:15, minOrder:5000, maxOrder:null, scope:'category', scopeValue:['electronics'], status:'active', createdAt:'2026-06-05' },
    { id:3, name:'电子产品COD费率', desc:'电子产品专用混合计费', feeType:'mixed', currency:'GHS', feeValuePercent:1.5, feeValueFixed:5, minOrder:null, maxOrder:null, scope:'category', scopeValue:['electronics'], status:'active', createdAt:'2026-06-08' },
    { id:4, name:'钻石会员优惠费率', desc:'钻石会员专属优惠', feeType:'percentage', currency:'GHS', feeValue:1.0, feeValuePercent:1.0, feeValueFixed:null, minOrder:null, maxOrder:null, scope:'member_tier', scopeValue:['platinum'], status:'active', createdAt:'2026-06-10' },
    { id:5, name:'小额订单费率', desc:'小额订单固定收费', feeType:'fixed', currency:'GHS', feeValue:3, feeValuePercent:null, feeValueFixed:3, minOrder:null, maxOrder:100, scope:'all', scopeValue:[], status:'inactive', createdAt:'2026-05-20' },
    { id:6, name:'时尚服饰COD费率', desc:'时尚服饰类目专用', feeType:'percentage', currency:'GHS', feeValue:2.0, feeValuePercent:2.0, feeValueFixed:null, minOrder:null, maxOrder:null, scope:'category', scopeValue:['fashion'], status:'active', createdAt:'2026-06-15' },
    { id:7, name:'食品饮料COD费率', desc:'食品饮料类目', feeType:'fixed', currency:'GHS', feeValue:5, feeValuePercent:null, feeValueFixed:5, minOrder:null, maxOrder:300, scope:'category', scopeValue:['food'], status:'active', createdAt:'2026-06-18' },
    { id:8, name:'银卡会员费率', desc:'银卡会员专属', feeType:'percentage', currency:'GHS', feeValue:1.5, feeValuePercent:1.5, feeValueFixed:null, minOrder:null, maxOrder:null, scope:'member_tier', scopeValue:['silver'], status:'active', createdAt:'2026-06-20' },
    { id:9, name:'金卡会员费率', desc:'金卡会员专属优惠', feeType:'percentage', currency:'GHS', feeValue:1.2, feeValuePercent:1.2, feeValueFixed:null, minOrder:null, maxOrder:null, scope:'member_tier', scopeValue:['gold'], status:'inactive', createdAt:'2026-06-22' },
    { id:10, name:'大额订单费率', desc:'大额订单封顶费率', feeType:'fixed', currency:'GHS', feeValue:50, feeValuePercent:null, feeValueFixed:50, minOrder:10000, maxOrder:null, scope:'all', scopeValue:[], status:'active', createdAt:'2026-06-25' },
];

            let editingId = null;
            let currentPage = 1;
            const pageSize = 10;

            const scopeMap = {
                all: "全部商品",
                category: "按分类",
                member_tier: "按会员等级",
            };
            const feeTypeMap = {
                percentage: "按比例",
                fixed: "固定金额",
                mixed: "混合",
            };
            const categoryOptions = [
                { value: "electronics", label: "电子产品" },
                { value: "fashion", label: "时尚服饰" },
                { value: "home", label: "家居生活" },
                { value: "food", label: "食品饮料" },
            ];
            const tierOptions = [
                { value: "basic", label: "普通会员" },
                { value: "silver", label: "银卡会员" },
                { value: "gold", label: "金卡会员" },
                { value: "platinum", label: "钻石会员" },
            ];

            // ===== Helpers =====
            function getFiltered() {
                const kw = document
                    .getElementById("filterKeyword")
                    .value.toLowerCase();
                const feeType = document.getElementById("filterFeeType").value;
                const status = document.getElementById("filterStatus").value;
                const scope = document.getElementById("filterScope").value;
                return rules.filter((r) => {
                    if (kw && !r.name.toLowerCase().includes(kw)) return false;
                    if (feeType && r.feeType !== feeType) return false;
                    if (status && r.status !== status) return false;
                    if (scope && r.scope !== scope) return false;
                    return true;
                });
            }

            function render() {
                const filtered = getFiltered();
                document.getElementById("totalCount").textContent =
                    filtered.length;
                var rc = document.getElementById("ruleCount");
                if (rc) rc.textContent = rules.length;

                const totalPages = Math.max(
                    1,
                    Math.ceil(filtered.length / pageSize),
                );
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const page = filtered.slice(start, start + pageSize);

                const tbody = document.getElementById("tableBody");
                if (page.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="9"><div class="empty-state"><i class="fas fa-inbox"></i><div>暂无COD手续费，点击上方「新建规则」创建</div></div></td></tr>';
                } else {
                    tbody.innerHTML = page.map((r) => {
                        let feeLabel = "";
                        if (r.feeType === "percentage")
                            feeLabel = r.feeValue + "%";
                        else if (r.feeType === "fixed")
                            feeLabel = r.feeValue + " " + r.currency;
                        else
                            feeLabel =
                                r.feeValuePercent +
                                "% + " +
                                r.feeValueFixed +
                                r.currency;
                        return `<tr>
        <td><div style="font-weight:500">${esc(r.name)}</div>${r.desc ? '<div style="color:#999;font-size:12px;margin-top:2px">' + esc(r.desc) + "</div>" : ""}</td>
        <td><span class="tag ${r.feeType === "percentage" ? "tag-primary" : r.feeType === "fixed" ? "tag-default" : "tag-warning"}">${feeTypeMap[r.feeType]}</span></td>
        <td>${feeLabel}</td>
        <td>${r.minOrder != null ? r.minOrder.toLocaleString() + " GHS" : "—"}</td>
        <td>${r.maxOrder != null ? r.maxOrder.toLocaleString() + " GHS" : "—"}</td>
        <td>${scopeMap[r.scope]}</td>
        <td><span class="tag ${r.status === "active" ? "tag-success" : "tag-default"}">${r.status === "active" ? "启用" : "停用"}</span></td>
        <td style="color:#999;font-size:13px">${r.createdAt}</td>
        <td><div class="actions" style="justify-content:flex-start">
          <button class="btn btn-text btn-xs" onclick="editRule(${r.id})">编辑</button>
          <button class="btn btn-text btn-xs" onclick="toggleStatus(${r.id})">${r.status === "active" ? "停用" : "启用"}</button>
          <button class="btn btn-text btn-xs btn-danger" onclick="deleteRule(${r.id})">删除</button>
        </div></td>
      </tr>`;
                    });
                }

                // Pagination
                const pg = document.getElementById("pagination");
                if (totalPages <= 1) {
                    pg.innerHTML = "";
                    return;
                }
                let html = "";
                html += `<button ${currentPage <= 1 ? "disabled" : ""} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage)
                        html += `<button class="active">${i}</button>`;
                    else html += `<button onclick="goPage(${i})">${i}</button>`;
                }
                html += `<button ${currentPage >= totalPages ? "disabled" : ""} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
                html += `<span class="info">共 ${filtered.length} 条</span>`;
                pg.innerHTML = html;
            }

            function esc(s) {
                if (!s) return "";
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            function goPage(p) {
                currentPage = p;
                render();
            }

            // ===== Filters =====
            function applyFilters() {
                currentPage = 1;
                render();
            }
            function resetFilters() {
                document.getElementById("filterKeyword").value = "";
                document.getElementById("filterFeeType").value = "";
                document.getElementById("filterStatus").value = "";
                document.getElementById("filterScope").value = "";
                applyFilters();
            }

            // ===== Modal =====
            function openModal(data) {
                editingId = data ? data.id : null;
                document.getElementById("modalTitle").textContent = data
                    ? "编辑COD手续费"
                    : "新建COD手续费";
                document.getElementById("formName").value = data
                    ? data.name
                    : "";
                document.getElementById("formFeeType").value = data
                    ? data.feeType
                    : "percentage";
                document.getElementById("formCurrency").value = data
                    ? data.currency || "GHS"
                    : "GHS";
                document.getElementById("formPercent").value =
                    data &&
                    (data.feeType === "percentage" || data.feeType === "mixed")
                        ? data.feeValuePercent || data.feeValue || ""
                        : "";
                document.getElementById("formFixed").value =
                    data &&
                    (data.feeType === "fixed" || data.feeType === "mixed")
                        ? data.feeValueFixed || data.feeValue || ""
                        : "";
                document.getElementById("formMinOrder").value = data
                    ? data.minOrder || ""
                    : "";
                document.getElementById("formMaxOrder").value = data
                    ? data.maxOrder || ""
                    : "";
                document.getElementById("formScope").value = data
                    ? data.scope
                    : "all";
                document.getElementById("formStatus").value = data
                    ? data.status
                    : "active";
                document.getElementById("formDesc").value = data
                    ? data.desc || ""
                    : "";
                onFeeTypeChange();
                onScopeChange();
                // Set scope values
                const sv = document.getElementById("formScopeValue");
                if (data && data.scopeValue) {
                    Array.from(sv.options).forEach(
                        (o) => (o.selected = data.scopeValue.includes(o.value)),
                    );
                } else {
                    Array.from(sv.options).forEach((o) => (o.selected = false));
                }
                document.getElementById("modalOverlay").classList.add("open");
            }

            function closeModal() {
                document
                    .getElementById("modalOverlay")
                    .classList.remove("open");
                editingId = null;
            }

            function onFeeTypeChange() {
                const t = document.getElementById("formFeeType").value;
                document.getElementById("percentGroup").style.display =
                    t === "percentage" || t === "mixed" ? "" : "none";
                document.getElementById("fixedGroup").style.display =
                    t === "fixed" || t === "mixed" ? "" : "none";
            }

            function onScopeChange() {
                const s = document.getElementById("formScope").value;
                const g = document.getElementById("scopeValueGroup");
                const sel = document.getElementById("formScopeValue");
                if (s === "category" || s === "member_tier") {
                    g.style.display = "";
                    document.getElementById("scopeValueLabel").textContent =
                        s === "category" ? "商品分类" : "会员等级";
                    const opts =
                        s === "category" ? categoryOptions : tierOptions;
                    sel.innerHTML = opts
                        .map(
                            (o) =>
                                '<option value="' +
                                o.value +
                                '">' +
                                o.label +
                                "</option>",
                        )
                        .join("");
                } else {
                    g.style.display = "none";
                }
            }

            function submitForm() {
                const name = document.getElementById("formName").value.trim();
                if (!name) {
                    alert("请输入规则名称");
                    return;
                }
                const feeType = document.getElementById("formFeeType").value;
                const currency = document.getElementById("formCurrency").value;
                const percent =
                    parseFloat(document.getElementById("formPercent").value) ||
                    null;
                const fixed =
                    parseFloat(document.getElementById("formFixed").value) ||
                    null;
                const minOrder = document.getElementById("formMinOrder").value
                    ? parseFloat(document.getElementById("formMinOrder").value)
                    : null;
                const maxOrder = document.getElementById("formMaxOrder").value
                    ? parseFloat(document.getElementById("formMaxOrder").value)
                    : null;
                const scope = document.getElementById("formScope").value;
                const status = document.getElementById("formStatus").value;
                const desc = document.getElementById("formDesc").value.trim();
                const scopeValue = Array.from(
                    document.getElementById("formScopeValue").selectedOptions,
                ).map((o) => o.value);

                if (feeType === "percentage" && percent == null) {
                    alert("请输入比例费率");
                    return;
                }
                if (feeType === "fixed" && fixed == null) {
                    alert("请输入固定金额");
                    return;
                }
                if (feeType === "mixed" && (percent == null || fixed == null)) {
                    alert("请填写完整的混合计费信息");
                    return;
                }

                const form = {
                    name,
                    feeType,
                    currency,
                    minOrder,
                    maxOrder,
                    scope,
                    scopeValue,
                    status,
                    desc,
                    feeValue:
                        feeType === "percentage"
                            ? percent
                            : feeType === "fixed"
                              ? fixed
                              : percent + "% + " + fixed,
                    feeValuePercent:
                        feeType === "percentage" || feeType === "mixed"
                            ? percent
                            : null,
                    feeValueFixed:
                        feeType === "fixed" || feeType === "mixed"
                            ? fixed
                            : null,
                    createdAt: new Date().toISOString().slice(0, 10),
                };

                if (editingId) {
                    const i = rules.findIndex((r) => r.id === editingId);
                    if (i >= 0) {
                        form.id = editingId;
                        rules[i] = { ...rules[i], ...form };
                    }
                } else {
                    form.id = Date.now();
                    rules.push(form);
                }
                closeModal();
                render();
            }

            function editRule(id) {
                const r = rules.find((x) => x.id === id);
                if (r) openModal(r);
            }

            function toggleStatus(id) {
                const r = rules.find((x) => x.id === id);
                if (r) {
                    r.status = r.status === "active" ? "inactive" : "active";
                    render();
                }
            }

            function deleteRule(id) {
                if (!confirm("确认删除此规则？")) return;
                rules = rules.filter((x) => x.id !== id);
                render();
            }

            // Init
            renderSidebar("fee");
            try { render(); } catch(e) { console.error('Render error:', e); document.getElementById('tableBody').innerHTML = '<tr><td colspan="9"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div>数据加载异常，请刷新页面重试</div></div></td></tr>'; }
        </script>
    </body>
</html>
