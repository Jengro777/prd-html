                <label

                        <option>服装鞋帽</option>
                        <option>家居用品</option>
                        <option>食品饮料</option>

                </label>
                <label
                    >日期:
                    <input type="date" />
                </label>
                <div class="input-group">
                    <input
                        type="text"
                        placeholder="搜索商品名称..."

                    />
                </div>
                <button
                    class="btn btn-primary btn-sm"
                    onclick="showToast('info', '筛选条件已更新')"

                    筛选

            </div>

            <div class="review-layout">
                <div class="review-list">
                    <div class="review-list-header">
                        <span>审核列表</span>
                        <span class="review-list-count">共 23 条</span>
                    </div>
                    <div class="review-items" id="reviewItems"></div>
                </div>

                <div class="detail-panel" id="detailPanel">
                    <div class="detail-empty" id="emptyState">
                        <div class="empty-icon">&#128269;</div>
                        <div class="empty-text">选择左侧商品进行审核</div>
                    </div>
                    <div class="detail-content" id="detailContent">
                        <div class="detail-header">
                            <div>
                                <div
                                    class="detail-title"
                                    id="detailTitle"
                                ></div>
                                <div class="detail-meta" id="detailMeta"></div>
                            </div>
                            <span
                                class="badge badge-warning"
                                id="detailStatusBadge"
                                >待审核</span
                            >
                        </div>

                        <div class="field-group">
                            <div class="field-label">商品标题</div>
                            <div
                                class="field-value ai-field"
                                id="detailFieldTitle"
                            ></div>
                        </div>
                        <div class="field-group">
                            <div class="field-label">售价</div>
                            <div
                                class="field-value"
                                id="detailFieldPrice"
                            ></div>
                        </div>
                        <div class="field-group">
                            <div class="field-label">商品描述</div>
                            <div
                                class="field-value ai-field"
                                id="detailFieldDesc"
                            ></div>
                        </div>
                        <div class="field-group">
                            <div class="field-label">核心卖点</div>
                            <div
                                class="field-value ai-field"
                                id="detailFieldSelling"
                            ></div>
                        </div>

                        <div class="checklist" id="checklistContainer">
                            <div class="checklist-title">质量检查清单</div>
                        </div>

                        <div class="detail-actions">
                            <button
                                class="btn btn-success"
                                onclick="approveItem()"
                            >
                                &#10003; 通过
                            </button>
                            <button
                                class="btn btn-danger"
                                onclick="showRejectModal()"
                            >
                                &#10007; 驳回并备注
                            </button>
                            <button
                                class="btn btn-outline"
                                onclick="editItem()"
                            >
                                &#9998; 编辑
                            </button>
                            <button
                                class="btn btn-outline"
                                onclick="regenerateItem(event)"
                            >
                                &#8635; 重新生成
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="rejectModal">
            <div class="modal">
                <div class="modal-title">驳回原因</div>
                <textarea
                    id="rejectReason"
                    placeholder="请输入驳回原因或备注信息..."

                <div class="modal-actions">
                    <button
                        class="btn btn-outline"
                        onclick="closeRejectModal()"
                    >
                        取消
                    </button>
                    <button class="btn btn-danger" onclick="confirmReject()">
                        确认驳回
                    </button>
                </div>
            </div>
        </div>

            const checklistLabels = [
                "标题合规性检查",
                "价格合理性校验",
                "描述完整性检查",
                "图片ALT文本检查",
                "违禁词过滤检查",
                "广告法合规检查",
                "类目匹配度检查",
                "SEO关键词检查",
            ];

            let selectedId = null;
            let currentItems = [...mockItems];

            function renderList(items) {
                const container = document.getElementById("reviewItems");
                container.innerHTML = "";
                items.forEach((item) => {
                    const badgeClass =
                        item.confidenceLevel === "high"
                            ? "badge-high"
                            : item.confidenceLevel === "mid"
                              ? "badge-mid"
                              : "badge-low";
                    const badgeText =
                        item.confidenceLevel === "high"
                            ? "高置信度"
                            : item.confidenceLevel === "mid"
                              ? "中置信度"
                              : "低置信度";
                    const div = document.createElement("div");
                    div.className = `review-item ${selectedId === item.id ? "active" : ""}`;
                    div.dataset.id = item.id;
                    div.innerHTML = `
      <div class="item-name">${item.name}</div>
      <div class="item-category">${item.category}</div>
      <div class="item-meta">
        <span class="badge ${badgeClass}">${item.confidence}%</span>
        <span>${item.date} ${item.time}</span>
      </div>
    `;
                    div.addEventListener("click", () => selectItem(item.id));
                    container.appendChild(div);
                });
            }

            function selectItem(id) {
                selectedId = id;
                const item = currentItems.find((i) => i.id === id);
                if (!item) return;
                renderList(currentItems);
                document.getElementById("emptyState").style.display = "none";
                const content = document.getElementById("detailContent");
                content.style.display = "block";
                content.style.animation = "none";
                setTimeout(() => {
                    content.style.animation = "fadeIn 0.3s ease";
                }, 10);

                document.getElementById("detailTitle").textContent = item.name;
                const badgeMap = {
                    pending: "badge-warning",
                    low: "badge-danger",
                };
                const textMap = {
                    pending: "待审核",
                    approved: "已通过",
                    rejected: "已驳回",
                };
                document.getElementById("detailStatusBadge").className =
                    `badge ${item.status === "pending" ? "badge-warning" : "badge-success"}`;
                document.getElementById("detailStatusBadge").textContent =
                    textMap[item.status] || "待审核";
                document.getElementById("detailMeta").innerHTML =
                    `<span>${item.category}</span><span>|</span><span>提交时间: ${item.date} ${item.time}</span><span>|</span><span class="badge ${item.confidenceLevel === "high" ? "badge-high" : item.confidenceLevel === "mid" ? "badge-mid" : "badge-low"}">AI置信度 ${item.confidence}%</span>`;

                document.getElementById("detailFieldTitle").textContent =
                    item.name;
                document.getElementById("detailFieldPrice").textContent =
                    item.price;
                document.getElementById("detailFieldDesc").textContent =
                    item.desc;
                document.getElementById("detailFieldSelling").textContent =
                    item.selling;

                const checklistContainer =
                    document.getElementById("checklistContainer");
                let html = '<div class="checklist-title">质量检查清单</div>';
                item.checklist.forEach((pass, idx) => {
                    html += `<div class="checklist-item"><span class="checklist-icon ${pass ? "pass" : "fail"}">${pass ? "&#10003;" : "&#10007;"}</span>${checklistLabels[idx]}</div>`;
                });
                checklistContainer.innerHTML = html;

                const actions = document.querySelector(".detail-actions");
                actions.style.display = "flex";
            }

            function showToast(type, msg) {
                const container = document.getElementById("toastContainer");
                const colors = {
                    success: "toast-success",
                    error: "toast-error",
                    info: "toast-info",
                };
                const icons = {
                    success: "&#10003;",
                    error: "&#10007;",
                    info: "&#8505;",
                };
                const toast = document.createElement("div");
                toast.className = `toast ${colors[type] || "toast-info"}`;
                toast.innerHTML = `<span>${icons[type] || "&#8505;"}</span> ${msg}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            function approveItem() {
                const item = currentItems.find((i) => i.id === selectedId);
                if (!item) return;
                item.status = "approved";
                showToast("success", `"${item.name}" 已通过审核`);
                document.getElementById("detailStatusBadge").className =
                    "badge badge-success";
                document.getElementById("detailStatusBadge").textContent =
                    "已通过";
            }

            function showRejectModal() {
                document.getElementById("rejectModal").classList.add("show");
                document.getElementById("rejectReason").value = "";
            }

            function closeRejectModal() {
                document.getElementById("rejectModal").classList.remove("show");
            }

            function confirmReject() {
                const reason = document
                    .getElementById("rejectReason")
                    .value.trim();
                if (!reason) {
                    showToast("error", "请输入驳回原因");
                    return;
                }
                const item = currentItems.find((i) => i.id === selectedId);
                if (item) {
                    item.status = "rejected";
                    showToast(
                        "error",
                        `"${item.name}" 已驳回，原因: ${reason}`,
                    );
                    document.getElementById("detailStatusBadge").className =
                        "badge badge-danger";
                    document.getElementById("detailStatusBadge").textContent =
                        "已驳回";
                }
                closeRejectModal();
            }

            function editItem() {
                showToast("info", "已打开编辑页面，可修改商品信息");
            }

            function regenerateItem(event) {
                const btn = event.currentTarget;
                btn.innerHTML =
                    '<span class="loading-spinner"></span> 生成中...';
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerHTML = "&#8635; 重新生成";
                    btn.disabled = false;
                    const item = currentItems.find((i) => i.id === selectedId);
                    if (item) {
                        const newConf = Math.floor(Math.random() * 20) + 80;
                        item.confidence = newConf;
                        item.confidenceLevel =
                            newConf >= 90
                                ? "high"
                                : newConf >= 70
                                  ? "mid"
                                  : "low";
                        item.desc = item.desc + "（已优化）";
                        showToast(
                            "success",
                            `"${item.name}" AI已重新生成内容，请重新审核`,
                        );
                        const metaEl = document.getElementById("detailMeta");
                        metaEl.innerHTML = metaEl.innerHTML.replace(
                            /AI置信度 \d+%/,
                            `AI置信度 ${item.confidence}%`,
                        );
                    }
                }, 1500);
            }

            document
                .getElementById("searchInput")
                .addEventListener("input", function () {
                    const q = this.value.toLowerCase();
                    currentItems = mockItems.filter((i) =>
                        i.name.toLowerCase().includes(q),
                    );
                    renderList(currentItems);
                    if (selectedId) {
                        const stillExists = currentItems.find(
                            (i) => i.id === selectedId,
                        );
                        if (!stillExists) {
                            selectedId = null;
                            document.getElementById(
                                "emptyState",
                            ).style.display = "flex";
                            document.getElementById(
                                "detailContent",
                            ).style.display = "none";
                        }
                    }
                });

            document
                .getElementById("filterStatus")
                .addEventListener("change", function () {
                    const val = this.value;
                    currentItems =
                        val === "all"
                            ? [...mockItems]
                            : mockItems.filter((i) => i.status === val);
                    renderList(currentItems);
                    selectedId = null;
                    document.getElementById("emptyState").style.display =
                        "flex";
                    document.getElementById("detailContent").style.display =
                        "none";
                });

            document
                .getElementById("filterConfidence")
                .addEventListener("change", function () {
                    const val = this.value;
                    currentItems =
                        val === "all"
                            ? [...mockItems]
                            : mockItems.filter(
                                  (i) => i.confidenceLevel === val,
                              );
                    renderList(currentItems);
                    selectedId = null;
                    document.getElementById("emptyState").style.display =
