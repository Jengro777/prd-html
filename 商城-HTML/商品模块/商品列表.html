<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <title>商品列表 | 按SPU编码自动分组</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", sans-serif;
                background: #f1f5f9;
                color: #0f172a;
            }

            .navbar {
                background: white;
                border-bottom: 1px solid #e2e8f0;
                padding: 0 32px;
                position: sticky;
                top: 0;
                z-index: 100;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
            }

            .nav-container {
                max-width: 1400px;
                margin: 0 auto;
                display: flex;
                gap: 32px;
                align-items: center;
            }

            .nav-item {
                padding: 16px 0;
                font-weight: 500;
                cursor: pointer;
                border-bottom: 2px solid transparent;
                transition: all 0.2s;
                color: #475569;
            }

            .nav-item.active {
                color: #3b82f6;
                border-bottom-color: #3b82f6;
            }

            /* 在售/不可售 选项卡 */
            .sale-tab {
                padding: 14px 20px;
                font-weight: 500;
                font-size: 0.85rem;
                cursor: pointer;
                border-bottom: 2px solid transparent;
                transition: all 0.2s;
                color: #64748b;
                user-select: none;
            }

            .sale-tab:hover {
                color: #334155;
            }

            .sale-tab.active {
                color: #3b82f6;
                border-bottom-color: #3b82f6;
            }

            .sale-tab-count {
                background: #e2e8f0;
                padding: 1px 8px;
                border-radius: 10px;
                font-size: 0.7rem;
                margin-left: 6px;
                color: #475569;
            }

            .sale-tab.active .sale-tab-count {
                background: #dbeafe;
                color: #1e40af;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 28px 24px;
            }

            .card {
                background: white;
                border-radius: 20px;
                border: 1px solid #e2e8f0;
                overflow: hidden;
                margin-bottom: 24px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            }

            .card-header {
                padding: 18px 24px;
                background: #fafcff;
                border-bottom: 1px solid #eef2ff;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
            }

            .card-title {
                font-weight: 600;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .card-body {
                padding: 24px;
            }

            .btn {
                padding: 10px 20px;
                border-radius: 40px;
                font-weight: 500;
                font-size: 0.85rem;
                cursor: pointer;
                border: none;
                transition: all 0.2s;
            }

            .btn-outline {
                background: white;
                border: 1px solid #cbd5e1;
                color: #334155;
            }

            .btn-outline:hover {
                background: #f8fafc;
                border-color: #94a3b8;
            }

            .btn-sm {
                padding: 6px 14px;
                font-size: 0.75rem;
            }

            .badge {
                background: #e2e8f0;
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 0.7rem;
            }

            .empty-state {
                text-align: center;
                padding: 60px 24px;
                color: #94a3b8;
            }

            /* SPU卡片样式 */
            .spu-card {
                background: white;
                border-radius: 20px;
                border: 1px solid #e2e8f0;
                margin-bottom: 24px;
                overflow: hidden;
                transition: all 0.2s;
            }

            .spu-card.selected {
                border-color: #3b82f6;
                box-shadow:
                    0 0 0 1px #3b82f6,
                    0 4px 12px rgba(59, 130, 246, 0.1);
            }

            .spu-header {
                padding: 8px 20px;
                background: linear-gradient(135deg, #f8fafc, #ffffff);
                border-bottom: 1px solid #e2e8f0;
                display: flex;
                justify-content: flex-start;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
            }

            .spu-header-main-wrap {
                flex: 1;
                min-width: 0;
            }

            .spu-code {
                font-size: 0.95rem;
                font-weight: 700;
                font-family: monospace;
                color: #3b82f6;
                width: 9em;
                flex-shrink: 0;
                white-space: nowrap;
            }

            .spu-stats {
                font-size: 0.7rem;
                color: #64748b;
            }

            /* 平铺SKU网格 */
            .sku-tile-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 8px;
            }

            /* 卡片模式下，图片占满宽度并保持方形，属性流式排列 */
            .sku-tile-grid .sku-tile {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .sku-tile-grid .sku-tile-img {
                width: 80px;
                aspect-ratio: 1 / 1;
                margin: 0;
                border-radius: 4px;
            }

            .sku-tile-grid .sku-tile-specs {
                margin-bottom: 0;
            }

            .sku-tile-grid .sku-tile-name {
                margin-bottom: 0;
            }

            .sku-tile-grid .sku-tile-meta {
                flex-wrap: wrap;
                border-top: none;
                padding-top: 0;
            }

            .sku-tile-grid .sku-tile-meta > span:last-child {
                width: 100%;
                justify-content: flex-end;
                padding-top: 3px;
                margin-top: 2px;
                border-top: 1px solid #e2e8f0;
            }

            .sku-tile {
                background: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                padding: 6px 8px;
                transition: all 0.2s;
                cursor: pointer;
            }

            .sku-tile:hover {
                border-color: #94a3b8;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            }

            .sku-tile.selected {
                border-color: #3b82f6;
                background: #eff6ff;
                box-shadow: 0 0 0 1px #3b82f6;
            }

            .sku-tile.selected .sku-tile-name::before {
                content: "✓";
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 16px;
                height: 16px;
                background: #3b82f6;
                color: white;
                border-radius: 3px;
                font-size: 0.65rem;
                flex-shrink: 0;
                margin-right: 2px;
            }

            /* SKU tile 复选框：仅列表模式显示，放在最左侧 */
            .sku-tile-cb-label {
                display: none;
                align-items: center;
                cursor: pointer;
                flex-shrink: 0;
                padding: 0 2px 0 4px;
            }

            .sku-tile-cb-label input[type="checkbox"] {
                width: 15px;
                height: 15px;
                cursor: pointer;
                accent-color: #3b82f6;
            }

            .sku-tile-list .sku-tile-cb-label {
                display: flex;
                order: -1;
            }

            .sku-tile-list .sku-tile .sku-tile-name::before {
                display: none;
            }

            .sku-tile-xsin {
                font-size: 0.6rem;
                color: #94a3b8;
                font-family: monospace;
                line-height: 1.2;
                margin-top: 1px;
            }

            .spu-header {
                cursor: pointer;
                user-select: none;
            }

            .spu-header:hover {
                background: linear-gradient(135deg, #f1f5f9, #f8fafc);
            }

            .spu-collapse-arrow {
                font-size: 0.65rem;
                color: #94a3b8;
                transition: transform 0.2s;
                flex-shrink: 0;
            }

            .spu-select-all-label {
                display: flex;
                align-items: center;
                cursor: pointer;
                padding: 0 2px 0 4px;
                flex-shrink: 0;
            }

            .spu-select-all-label input[type="checkbox"] {
                width: 15px;
                height: 15px;
                cursor: pointer;
                accent-color: #3b82f6;
            }

            .set-default-badge {
                background: #e2e8f0 !important;
                color: #64748b !important;
                cursor: pointer;
                transition: all 0.15s;
                font-size: 0.6rem !important;
                padding: 1px 6px !important;
            }

            .set-default-badge:hover {
                background: #cbd5e1 !important;
                color: #334155 !important;
            }

            .sku-tile-name {
                font-weight: 600;
                font-size: 0.75rem;
                margin-bottom: 2px;
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .sku-tile-specs {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
                margin-bottom: 4px;
            }

            .sku-tile-img {
                width: 72px;
                aspect-ratio: 1 / 1;
                border-radius: 8px;
                overflow: hidden;
                background: #f1f5f9;
                margin: 0 auto 4px;
            }

            .sku-tile-img img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .sku-tile-img-placeholder {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                color: #94a3b8;
            }

            .spec-tag {
                background: #f1f5f9;
                color: #475569;
                padding: 1px 6px;
                border-radius: 12px;
                font-size: 0.65rem;
                font-weight: 500;
            }

            .sku-tile-meta {
                font-size: 0.7rem;
                color: #475569;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-top: 4px;
                border-top: 1px solid #e2e8f0;
            }

            .sku-view-btn {
                padding: 1px 6px;
                border-radius: 8px;
                border: 1px solid #cbd5e1;
                background: white;
                font-size: 0.65rem;
                cursor: pointer;
                transition: all 0.15s;
                color: #475569;
            }

            .sku-view-btn:hover {
                background: #3b82f6;
                color: white;
                border-color: #3b82f6;
            }

            .sku-clone-btn {
                padding: 1px 6px;
                border-radius: 8px;
                border: 1px solid #cbd5e1;
                background: white;
                font-size: 0.65rem;
                cursor: pointer;
                transition: all 0.15s;
                color: #475569;
            }

            .sku-clone-btn:hover {
                background: #475569;
                color: white;
                border-color: #475569;
            }

            /* SPU头部主内容区（图片 + 名称 + 说明） */
            .spu-header-main {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 2px;
            }

            .spu-hero-img {
                width: 48px;
                height: 48px;
                border-radius: 6px;
                overflow: hidden;
                background: #f1f5f9;
                flex-shrink: 0;
            }

            .spu-hero-img img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            /* 查看更多卡片 */
            .sku-tile-more {
                background: #f8fafc;
                border: 2px dashed #cbd5e1;
                border-radius: 6px;
                padding: 10px 12px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 160px;
                gap: 4px;
                color: #64748b;
            }

            .sku-tile-more:hover {
                border-color: #3b82f6;
                background: #f0f4ff;
                color: #3b82f6;
            }

            .sku-tile-more-count {
                font-size: 1.5rem;
                font-weight: 700;
            }

            .sku-tile-more-label {
                font-size: 0.85rem;
            }

            /* 模态弹窗 */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                animation: fadeIn 0.2s ease;
            }

            .modal-content {
                background: white;
                border-radius: 20px;
                max-width: 1200px;
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
                animation: scaleIn 0.2s ease;
            }

            .modal-header {
                padding: 20px 24px;
                border-bottom: 1px solid #e2e8f0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                background: white;
                border-radius: 20px 20px 0 0;
                z-index: 1;
            }

            .modal-header-title {
                font-size: 1.1rem;
                font-weight: 600;
            }

            .modal-close {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: none;
                background: #f1f5f9;
                cursor: pointer;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.15s;
            }

            .modal-close:hover {
                background: #e2e8f0;
            }

            .modal-body {
                padding: 24px;
            }

            /* ===== 列表模式 ===== */
            .sku-tile-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .sku-tile-list .sku-tile {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 5px 10px;
                flex-direction: row;
                cursor: pointer;
            }

            .sku-tile-list .sku-tile-img {
                width: 36px;
                height: 36px;
                margin: 0;
                flex-shrink: 0;
                aspect-ratio: 1/1;
                order: -1;
            }

            .sku-tile-list .sku-tile-name {
                min-width: 100px;
                max-width: 160px;
                margin-bottom: 0;
                flex-shrink: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .sku-tile-list .sku-tile-specs {
                flex: 1;
                min-width: 120px;
                margin-bottom: 0;
                flex-wrap: nowrap;
                overflow-x: auto;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            .sku-tile-list .sku-tile-specs::-webkit-scrollbar {
                display: none;
            }

            .sku-tile-list .sku-tile-meta {
                flex-shrink: 0;
                min-width: 110px;
                padding-top: 0;
                border-top: none;
                gap: 6px;
            }

            .sku-tile-list .spec-tag {
                white-space: nowrap;
            }

            .sku-tile-list .sku-tile-more {
                flex-direction: row;
                min-height: 36px;
                padding: 5px 12px;
                gap: 6px;
            }

            .sku-tile-list .sku-tile-more-count {
                font-size: 0.95rem;
            }

            .sku-tile-list .sku-tile-more-label {
                font-size: 0.8rem;
            }

            /* 视图切换按钮组 */
            .view-toggle-group {
                display: flex;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                overflow: hidden;
            }

            .view-toggle-btn {
                padding: 4px 10px;
                background: white;
                border: none;
                cursor: pointer;
                font-size: 0.85rem;
                color: #64748b;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 4px;
                line-height: 1;
            }

            .view-toggle-btn:not(:last-child) {
                border-right: 1px solid #cbd5e1;
            }

            .view-toggle-btn:hover {
                background: #f1f5f9;
            }

            .view-toggle-btn.active {
                background: #3b82f6;
                color: white;
            }

            .view-toggle-btn.active:hover {
                background: #2563eb;
            }

            /* ===== 搜索面板 ===== */
            .search-panel {
                background: white;
                border-radius: 20px;
                border: 1px solid #e2e8f0;
                overflow: visible;
                margin-bottom: 20px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            }

            .search-panel .card-header {
                cursor: pointer;
                user-select: none;
            }

            .search-panel .card-header:hover {
                background: #f1f5f9;
            }

            .search-toggle-icon {
                transition: transform 0.2s ease;
                font-size: 0.7rem;
                color: #94a3b8;
            }

            .search-panel.collapsed .search-toggle-icon {
                transform: rotate(-90deg);
            }

            .search-body {
                overflow: hidden;
                transition:
                    max-height 0.3s ease,
                    padding 0.3s ease;
                max-height: 600px;
                padding: 16px 20px 20px;
            }

            .search-panel.collapsed .search-body {
                max-height: 0;
                padding: 0 20px;
            }

            .search-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px 20px;
            }

            .search-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }

            .search-field.search-full {
                grid-column: 1 / -1;
            }

            .search-field label {
                font-size: 0.75rem;
                font-weight: 500;
                color: #475569;
            }

            .search-field input,
            .search-field select {
                padding: 7px 10px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                font-size: 0.8rem;
                outline: none;
                transition: border-color 0.15s;
                background: white;
            }

            .search-field input:focus,
            .search-field select:focus {
                border-color: #3b82f6;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
            }

            .search-actions {
                display: flex;
                gap: 8px;
                margin-top: 14px;
                padding-top: 14px;
                border-top: 1px solid #f1f5f9;
            }

            .btn-primary {
                background: #3b82f6;
                color: white;
                border: none;
            }

            .btn-primary:hover {
                background: #2563eb;
            }

            /* ===== 多选下拉搜索组件 ===== */
            .ms-container {
                position: relative;
                z-index: 10;
            }

            .ms-container.ms-open {
                z-index: 100;
            }

            .ms-trigger {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                align-items: center;
                min-height: 32px;
                padding: 3px 6px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                background: white;
                cursor: pointer;
                transition: border-color 0.15s;
            }

            .ms-trigger:hover {
                border-color: #94a3b8;
            }

            .ms-open .ms-trigger {
                border-color: #3b82f6;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
            }

            .ms-tag {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                background: #dbeafe;
                color: #1e40af;
                font-size: 0.72rem;
                padding: 1px 6px;
                border-radius: 4px;
                white-space: nowrap;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .ms-tag-remove {
                cursor: pointer;
                font-size: 0.7rem;
                line-height: 1;
                opacity: 0.6;
            }

            .ms-tag-remove:hover {
                opacity: 1;
            }

            .ms-placeholder {
                color: #94a3b8;
                font-size: 0.8rem;
                padding: 2px 4px;
            }

            .ms-dropdown {
                display: none;
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                right: 0;
                background: white;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
                max-height: 260px;
                overflow: hidden;
                z-index: 200;
                animation: dropIn 0.15s ease;
            }

            .ms-open .ms-dropdown {
                display: block;
            }

            @keyframes dropIn {
                from {
                    opacity: 0;
                    transform: translateY(-4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .ms-filter-box {
                padding: 8px;
                border-bottom: 1px solid #f1f5f9;
                position: sticky;
                top: 0;
                background: white;
            }

            .ms-filter-input {
                width: 100%;
                padding: 6px 8px;
                border: 1px solid #e2e8f0;
                border-radius: 5px;
                font-size: 0.78rem;
                outline: none;
            }

            .ms-filter-input:focus {
                border-color: #3b82f6;
            }

            .ms-options {
                max-height: 180px;
                overflow-y: auto;
                padding: 4px 0;
            }

            .ms-option {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                font-size: 0.8rem;
                cursor: pointer;
                transition: background 0.1s;
                user-select: none;
            }

            .ms-option:hover {
                background: #f1f5f9;
            }

            .ms-option input[type="checkbox"] {
                accent-color: #3b82f6;
                flex-shrink: 0;
            }

            .ms-option.ms-hidden {
                display: none;
            }

            .ms-option .ms-indent {
                display: inline-block;
                width: 16px;
                flex-shrink: 0;
            }

            .ms-clear-all {
                display: block;
                width: 100%;
                padding: 5px;
                font-size: 0.72rem;
                color: #94a3b8;
                text-align: center;
                cursor: pointer;
                border-top: 1px solid #f1f5f9;
                transition: color 0.15s;
            }

            .ms-clear-all:hover {
                color: #ef4444;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes scaleIn {
                from {
                    transform: scale(0.95);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            /* ===== 分页器 ===== */
            .paginator {
                display: flex;

                align-items: center;

                height: 32px;
                padding: 0 8px;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                background: white;
                font-size: 0.8rem;
                color: #334155;
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
            }

            .paginator-btn:hover:not(:disabled):not(.active) {
                background: #f1f5f9;
                border-color: #94a3b8;
            }

            .paginator-btn.active {
                background: #3b82f6;
                color: white;
                border-color: #3b82f6;
            }

            .paginator-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .paginator-btn-prev,
            .paginator-btn-next {
                font-size: 0.75rem;
            }
