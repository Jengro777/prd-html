                createMultiSelect({
                    id: "origin",
                    options: originOpts,
                    placeholder: "选择产地",
                });
            }

            // ========== SPU分组 ==========
            function groupSkusBySpuCode(skuArray) {
                var arr = skuArray || skus;
                var groups = {};
                arr.forEach(function (sku) {
                    var code = sku.spuCode || "__未分组__";
                    if (!groups[code]) groups[code] = [];
                    groups[code].push(sku);
                });
                return groups;
            }

            // 用户可自定义每个SPU组的默认SKU
            var spuDefaultMap = {};
            var viewMode = "card"; // 'card' | 'list'
            var selectedSkuIds = {}; // { skuId: true } 选中状态
            var saleTab = "selling"; // 'selling' | 'unsellable'
            var currentPage = 1;
            var pageSize = 5;
            var expandedSpuCodes = {};

            // ========== 多选下拉搜索组件 ==========
            var msState = {}; // { msId: { selected: {value: true}, opts: [...] } }

            function createMultiSelect(config) {
                var id = config.id;
                var options = config.options || []; // [{value, label, indent}]
                var placeholder = config.placeholder || "请选择";
                var container = document.getElementById("ms-" + id);
                if (!container) return;

                var state = {
                    selected: {},
                    opts: options,
                    placeholder: placeholder,
                };
                msState[id] = state;

                function renderTags() {
                    var keys = Object.keys(state.selected);
                    var html = "";
                    if (keys.length === 0) {
                        html =
                            '<span class="ms-placeholder">' +
                            placeholder +
                            "</span>";
                    } else {
                        keys.forEach(function (v) {
                            var label = v;
                            for (var i = 0; i < options.length; i++) {
                                if (options[i].value === v) {
                                    label = options[i].label;
                                    break;
                                }
                            }
                            html +=
                                '<span class="ms-tag" data-value="' +
                                v.replace(/"/g, "&quot;") +
                                '">' +
                                escapeHtml(label) +
                                '<span class="ms-tag-remove" data-ms-id="' +
                                id +
                                '" data-value="' +
                                v.replace(/"/g, "&quot;") +
                                '">✕</span></span>';
                        });
                    }
                    return html;
                }

                function renderOptions(filter) {
                    var html = "";
                    for (var i = 0; i < options.length; i++) {
                        var opt = options[i];
                        var checked = state.selected[opt.value]
                            ? "checked"
                            : "";
                        var hidden =
                            filter &&
                            opt.label
                                .toLowerCase()
                                .indexOf(filter.toLowerCase()) === -1
                                ? " ms-hidden"
                                : "";
                        var indent = opt.indent
                            ? '<span class="ms-indent"></span>'.repeat(
                                  opt.indent,
                              )
                            : "";
                        html +=
                            '<label class="ms-option' +
                            hidden +
                            '" data-value="' +
                            opt.value.replace(/"/g, "&quot;") +
                            '">' +
                            '<input type="checkbox" value="' +
                            opt.value.replace(/"/g, "&quot;") +
                            '" ' +
                            checked +
                            " onchange=\"toggleMSOption('" +
                            id +
                            "','" +
                            opt.value.replace(/'/g, "\\'") +
                            "')\" />" +
                            indent +
                            escapeHtml(opt.label) +
                            "</label>";
                    }
                    return html;
                }

                container.innerHTML =
                    '<div class="ms-container" id="ms-cont-' +
                    id +
                    '">' +
                    '<div class="ms-trigger" onclick="event.stopPropagation();toggleMSDropdown(\'' +
                    id +
                    "')\">" +
                    '<div class="ms-tags" id="ms-tags-' +
                    id +
                    '">' +
                    renderTags() +
                    "</div>" +
                    "</div>" +
                    '<div class="ms-dropdown" id="ms-dd-' +
                    id +
                    '">' +
                    '<div class="ms-filter-box"><input class="ms-filter-input" placeholder="搜索..." oninput="filterMSOptions(\'' +
                    id +
                    "', this.value)\" /></div>" +
                    '<div class="ms-options" id="ms-opts-' +
                    id +
                    '">' +
                    renderOptions("") +
                    "</div>" +
                    '<div class="ms-clear-all" onclick="clearMS(\'' +
                    id +
                    "')\">清除选择</div>" +
                    "</div>" +
                    "</div>";

                // Tag remove click handlers
                container
                    .querySelectorAll(".ms-tag-remove")
                    .forEach(function (el) {
                        el.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var mid = el.dataset.msId;
                            var val = el.dataset.value;
                            if (msState[mid]) {
                                delete msState[mid].selected[val];
                                refreshMS(mid);
                            }
                        });
                    });
            }

            function toggleMSDropdown(id) {
                var cont = document.getElementById("ms-cont-" + id);
                if (!cont) return;
                var isOpen = cont.classList.contains("ms-open");
                // Close all
                document
                    .querySelectorAll(".ms-container.ms-open")
                    .forEach(function (c) {
                        c.classList.remove("ms-open");
                    });
                if (!isOpen) cont.classList.add("ms-open");
                // Reset filter
                var fi = cont.querySelector(".ms-filter-input");
                if (fi) {
                    fi.value = "";
                    filterMSOptions(id, "");
                }
            }

            function filterMSOptions(id, filter) {
                var opts = document.getElementById("ms-opts-" + id);
                if (!opts) return;
                opts.querySelectorAll(".ms-option").forEach(function (el) {
                    var label = el.textContent || "";
                    el.classList.toggle(
                        "ms-hidden",
                        filter &&
                            label
                                .toLowerCase()
                                .indexOf(filter.toLowerCase()) === -1,
                    );
                });
            }

            function toggleMSOption(id, value) {
                if (!msState[id]) return;
                if (msState[id].selected[value]) {
                    delete msState[id].selected[value];
                } else {
                    msState[id].selected[value] = true;
                }
                refreshMS(id);
            }

            function clearMS(id) {
                if (!msState[id]) return;
                msState[id].selected = {};
                refreshMS(id);
            }

            function refreshMS(id) {
                if (!msState[id]) return;
                var tags = document.getElementById("ms-tags-" + id);
                var opts = document.getElementById("ms-opts-" + id);
                if (!tags || !opts) return;
                var state = msState[id];
                // Update tags
                var keys = Object.keys(state.selected);
                var html = "";
                if (keys.length === 0) {
                    html =
                        '<span class="ms-placeholder">' +
                        (msState[id] && msState[id].placeholder
                            ? msState[id].placeholder
                            : "请选择") +
                        "</span>";
                } else {
                    keys.forEach(function (v) {
                        var label = v;
                        for (var i = 0; i < state.opts.length; i++) {
                            if (state.opts[i].value === v) {
                                label = state.opts[i].label;
                                break;
                            }
                        }
                        html +=
                            '<span class="ms-tag" data-value="' +
                            v.replace(/"/g, "&quot;") +
                            '">' +
                            escapeHtml(label) +
                            '<span class="ms-tag-remove" data-ms-id="' +
                            id +
                            '" data-value="' +
                            v.replace(/"/g, "&quot;") +
                            '">✕</span></span>';
                    });
                }
                tags.innerHTML = html;
                // Re-bind tag remove
                tags.querySelectorAll(".ms-tag-remove").forEach(function (el) {
                    el.addEventListener("click", function (e) {
                        e.stopPropagation();
                        var mid = el.dataset.msId;
                        var val = el.dataset.value;
                        if (msState[mid]) {
                            delete msState[mid].selected[val];
                            refreshMS(mid);
                        }
                    });
                });
                // Update checkboxes
                opts.querySelectorAll(
                    ".ms-option input[type=checkbox]",
                ).forEach(function (cb) {
                    cb.checked = !!state.selected[cb.value];
                });
            }

            // Close dropdowns on outside click
            document.addEventListener("click", function () {
                document
                    .querySelectorAll(".ms-container.ms-open")
                    .forEach(function (c) {
                        c.classList.remove("ms-open");
                    });
            });

            // ========== 搜索/筛选逻辑 ==========
            function getMSValues(id) {
                if (!msState[id]) return [];
                return Object.keys(msState[id].selected);
            }

            function getFilterValue(id) {
                var el = document.getElementById(id);
                return el ? el.value.trim() : "";
            }

            function filterSkus() {
                var title = getFilterValue("filterTitle").toLowerCase();
                var categories = getMSValues("category");
                var brands = getMSValues("brand");
                var statuses = getMSValues("status");
                var origins = getMSValues("origin");
                var shopName = getFilterValue("filterShopName").toLowerCase();
                var shopCode = getFilterValue("filterShopCode").toLowerCase();
                var dateFrom = getFilterValue("filterDateFrom");
                var dateTo = getFilterValue("filterDateTo");

                var noText = !title && !shopName && !shopCode;
                var noMS =
                    categories.length === 0 &&
                    brands.length === 0 &&
                    statuses.length === 0 &&
                    origins.length === 0;
                var noDate = !dateFrom && !dateTo;

                if (noText && noMS && noDate) return skus;

                return skus.filter(function (sku) {
                    // 在售/不可售 主选项卡过滤
                    if (saleTab === "selling" && sku.status !== "上架")
                        return false;
                    if (saleTab === "unsellable" && sku.status === "上架")
                        return false;

                    if (
                        title &&
                        (sku.name || "").toLowerCase().indexOf(title) === -1
                    )
                        return false;
                    if (
                        shopName &&
                        (sku.shopName || "").toLowerCase().indexOf(shopName) ===
                            -1
                    )
                        return false;
                    if (
                        shopCode &&
                        (sku.shopCode || "").toLowerCase().indexOf(shopCode) ===
                            -1
                    )
                        return false;
                    if (
                        categories.length > 0 &&
                        categories.indexOf(sku.category || "") === -1
                    )
                        return false;
                    if (
                        brands.length > 0 &&
                        brands.indexOf(sku.brand || "") === -1
                    )
                        return false;
                    if (
                        statuses.length > 0 &&
                        statuses.indexOf(sku.status || "") === -1
                    )
                        return false;
                    if (
                        origins.length > 0 &&
                        origins.indexOf(sku.origin || "") === -1
                    )
                        return false;
                    if (dateFrom && (sku.createdAt || "") < dateFrom)
                        return false;
                    if (dateTo && (sku.createdAt || "") > dateTo) return false;
                    return true;
                });
            }

            function applyFilters() {
                currentPage = 1;
                renderAll();
            }

            function toggleSearch() {
                document
                    .querySelector(".search-panel")
                    .classList.toggle("collapsed");
            }

            function resetFilters() {
                currentPage = 1;
                // Clear text/date inputs
                [
                    "filterTitle",
                    "filterShopName",
                    "filterShopCode",
                    "filterDateFrom",
                    "filterDateTo",
                ].forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.value = "";
                });
                // Clear multi-selects
                Object.keys(msState).forEach(function (id) {
                    msState[id].selected = {};
                    refreshMS(id);
                });
                renderAll();
            }

            // ========== 渲染SPU列表（平铺SKU卡片，可点击切换默认） ==========
            function renderSpuList() {
                var container = document.getElementById("spuListContainer");
                var groups = groupSkusBySpuCode(filterSkus());
                var groupKeys = Object.keys(groups).filter(function (k) {
                    return k !== "__未分组__";
                });

                if (groupKeys.length === 0) {
                    container.innerHTML =
                        '<div class="empty-state">暂无SPU组合，请在SKU编辑中填写"SPU组合码"</div>';
                    return;
                }

                // 分页
                var totalPages = Math.ceil(groupKeys.length / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                var start = (currentPage - 1) * pageSize;
                var pageKeys = groupKeys.slice(start, start + pageSize);

                var html = "";
                for (var g = 0; g < pageKeys.length; g++) {
                    var code = pageKeys[g];
                    var skuList = groups[code];

                    // 按销量降序排列，作为默认兜底
                    skuList.sort(function (a, b) {
                        return b.stock - a.stock;
                    });

                    // 优先使用用户指定的默认SKU，否则取销量最高的
                    var defaultSku = null;
                    var storedId = spuDefaultMap[code];
                    if (storedId) {
                        for (var i = 0; i < skuList.length; i++) {
                            if (skuList[i].id === storedId) {
                                defaultSku = skuList[i];
                                break;
                            }
                        }
                    }
                    if (!defaultSku) {
                        defaultSku = skuList[0];
                        spuDefaultMap[code] = defaultSku.id;
                    }

                    // 收集所有规格类型
                    var dimTypes = [];
                    skuList.forEach(function (sku) {
                        sku.specs.forEach(function (spec) {
                            if (dimTypes.indexOf(spec.type) === -1) {
                                dimTypes.push(spec.type);
                            }
                        });
                    });

                    // 默认SKU的名称作为SPU名称
                    var spuName = defaultSku
                        ? escapeHtml(defaultSku.name)
                        : "未命名";

                    var MAX_PREVIEW = 3;

                    // 平铺SKU卡片（最多展示一行）
                    var tilesHtml = "";
                    var previewCount = Math.min(skuList.length, MAX_PREVIEW);
                    for (var s = 0; s < previewCount; s++) {
                        var sku = skuList[s];
                        var isDefault = defaultSku && sku.id === defaultSku.id;

                        var specsHtml = "";
                        for (var sp = 0; sp < sku.specs.length; sp++) {
                            specsHtml +=
                                '<span class="spec-tag">' +
                                escapeHtml(sku.specs[sp].type) +
                                ": " +
                                escapeHtml(sku.specs[sp].value) +
                                "</span>";
                        }

                        tilesHtml +=
                            '<div class="sku-tile' +
                            (selectedSkuIds[sku.id] ? " selected" : "") +
                            '" data-spu-code="' +
                            escapeHtml(code) +
                            '" data-sku-id="' +
                            sku.id +
                            '">' +
                            '<label class="sku-tile-cb-label">' +
                            '<input type="checkbox" class="sku-tile-cb"' +
                            (selectedSkuIds[sku.id] ? " checked" : "") +
                            ">" +
                            "</label>" +
                            '<div class="sku-tile-img">' +
                            (sku.image
                                ? '<img src="' +
                                  escapeHtml(sku.image) +
                                  '" alt="" loading="lazy" />'
                                : '<div class="sku-tile-img-placeholder">📷</div>') +
                            "</div>" +
                            '<div class="sku-tile-name">' +
                            escapeHtml(sku.name) +
                            (sku.xsin
                                ? '<div class="sku-tile-xsin">' +
                                  escapeHtml(sku.xsin) +
                                  "</div>"
                                : "") +
                            "</div>" +
                            '<div class="sku-tile-specs">' +
                            specsHtml +
                            "</div>" +
                            '<div class="sku-tile-meta">' +
                            "<span>¥" +
                            sku.price +
                            "</span>" +
                            "<span>库存: " +
                            (sku.stock > 0 ? sku.stock : "充足") +
                            "</span>" +
                            '<span style="display:flex;gap:4px;align-items:center;">' +
                            (isDefault
                                ? '<span class="badge" style="background:#dbeafe;color:#1e40af;font-size:0.6rem;padding:1px 6px;">默认</span>'
                                : '<span class="badge set-default-badge" style="font-size:0.6rem;padding:1px 6px;">设为默认</span>') +
                            '<button class="sku-view-btn" data-sku-id="' +
                            sku.id +
                            '">查看</button>' +
                            '<button class="sku-clone-btn" data-sku-id="' +
                            sku.id +
                            '">克隆</button>' +
                            "</span>" +
                            "</div>" +
                            "</div>";
                    }

                    // 如果超过预览数量，添加"查看更多"卡片
                    if (skuList.length > MAX_PREVIEW) {
                        var remaining = skuList.length - MAX_PREVIEW;
                        tilesHtml +=
                            '<div class="sku-tile-more" data-spu-code="' +
                            escapeHtml(code) +
                            '">' +
                            '<div class="sku-tile-more-count">+' +
                            remaining +
                            "</div>" +
                            '<div class="sku-tile-more-label">查看全部 ' +
                            skuList.length +
                            " 个SKU</div>" +
                            "</div>";
                    }

                    // 计算该SPU组中已选数量
                    var selCount = 0;
                    for (var si = 0; si < skuList.length; si++) {
                        if (selectedSkuIds[skuList[si].id]) selCount++;
                    }

                    html +=
                        '<div class="spu-card">' +
                        '<div class="spu-header" data-spu="' +
                        escapeHtml(code) +
                        '">' +
                        '<label class="spu-select-all-label" title="全选/取消全选">' +
                        '<input type="checkbox" class="spu-select-all-cb" data-spu-code="' +
                        escapeHtml(code) +
                        '"' +
                        (selCount === skuList.length ? " checked" : "") +
                        ">" +
                        "</label>" +
                        '<div class="spu-header-main-wrap">' +
                        '<div class="spu-header-main">' +
                        '<div class="spu-code">' +
                        escapeHtml(code) +
                        "</div>" +
                        (defaultSku && defaultSku.image
                            ? '<div class="spu-hero-img"><img src="' +
                              escapeHtml(defaultSku.image) +
                              '" alt="" /></div>'
                            : '<div class="spu-hero-img" style="display:none;"></div>') +
                        '<div style="flex:1;min-width:0;">' +
                        '<div style="font-size:0.9rem;font-weight:600;color:#0f172a;">' +
                        spuName +
                        "</div>" +
                        '<div class="spu-stats">' +
                        skuList.length +
                        " 个SKU | " +
                        dimTypes.length +
                        " 种规格" +
                        "</div>" +
                        "</div>" +
                        "</div>" +
                        "</div>" +
                        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;">' +
                        '<div class="spu-stats">' +
                        "默认SKU: " +
                        (defaultSku
                            ? "¥" +
                              defaultSku.price +
                              " | " +
                              escapeHtml(
                                  defaultSku.specs
                                      .map(function (sp) {
                                          return sp.value;
                                      })
                                      .join(" / "),
                              )
                            : "自动取销量最高") +
                        "</div>" +
                        '<span class="spu-collapse-arrow">▶</span>' +
                        "</div>" +
                        "</div>" +
                        '<div class="card-body spu-card-body" style="display:' +
                        (expandedSpuCodes[code] ? "block" : "none") +
                        ';padding:10px 16px 16px;">' +
                        '<div class="' +
                        (viewMode === "list"
                            ? "sku-tile-list"
                            : "sku-tile-grid") +
                        '">' +
                        tilesHtml +
                        "</div>" +
                        "</div>" +
                        "</div>";
                }

                // SPU组渲染完成，与分页拼接
                container.innerHTML = html;

                // 点击"设为默认"徽章切换默认SKU
                container
                    .querySelectorAll(".set-default-badge")
                    .forEach(function (badge) {
                        badge.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var tile = badge.closest(".sku-tile");
                            if (!tile) return;
                            var code = tile.dataset.spuCode;
                            if (!code) return;
                            var skuId = parseInt(tile.dataset.skuId, 10);
                            if (spuDefaultMap[code] !== skuId) {
                                spuDefaultMap[code] = skuId;
                                renderAll();
                            }
                        });
                    });

                // 点击SPU全选复选框（独立于折叠交互）
                container
                    .querySelectorAll(".spu-select-all-cb")
                    .forEach(function (cb) {
                        cb.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var code = cb.dataset.spuCode;
                            if (!code) return;
                            var card = cb.closest(".spu-card");
                            if (!card) return;
                            var tiles = card.querySelectorAll(
                                ".sku-tile[data-sku-id]",
                            );
                            var ids = [];
                            tiles.forEach(function (t) {
                                ids.push(parseInt(t.dataset.skuId, 10));
                            });
                            if (cb.checked) {
                                ids.forEach(function (id) {
                                    selectedSkuIds[id] = true;
                                });
                            } else {
                                ids.forEach(function (id) {
                                    delete selectedSkuIds[id];
                                });
                            }
                            renderAll();
                        });
                    });

                // 点击SKU卡片切换选中状态（多选）
                container
                    .querySelectorAll(".sku-tile")
                    .forEach(function (tile) {
                        tile.addEventListener("click", function (e) {
                            // 如果点击的是内部按钮/徽章/复选框，不触发选中切换
                            if (
                                e.target.closest(".set-default-badge") ||
                                e.target.closest(".sku-view-btn") ||
                                e.target.closest(".sku-clone-btn") ||
                                e.target.closest(".sku-tile-cb-label")
                            )
                                return;
                            var skuId = parseInt(tile.dataset.skuId, 10);
                            if (selectedSkuIds[skuId]) {
                                delete selectedSkuIds[skuId];
                            } else {
                                selectedSkuIds[skuId] = true;
                            }
                            renderAll();
                        });
                    });

                // 点击SKU复选框（独立于卡片点击）
                container
                    .querySelectorAll(".sku-tile-cb")
                    .forEach(function (cb) {
                        cb.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var tile = cb.closest(".sku-tile");
                            if (!tile) return;
                            var skuId = parseInt(tile.dataset.skuId, 10);
                            if (selectedSkuIds[skuId]) {
                                delete selectedSkuIds[skuId];
                            } else {
                                selectedSkuIds[skuId] = true;
                            }
                            renderAll();
                        });
                    });

                // 点击SPU头部：展开/折叠（仅折叠，不含全选）
                container
                    .querySelectorAll(".spu-header")
                    .forEach(function (header) {
                        header.addEventListener("click", function () {
                            var card = header.closest(".spu-card");
                            if (!card) return;

                            // 展开/折叠（使用状态变量，避免renderAll重置）
                            var code = header.dataset.spu;
                            if (code) {
                                if (expandedSpuCodes[code]) {
                                    delete expandedSpuCodes[code];
                                } else {
                                    expandedSpuCodes[code] = true;
                                }
                            }

                            renderAll();
                        });
                    });

                // 点击"查看更多"打开弹窗
                container
                    .querySelectorAll(".sku-tile-more")
                    .forEach(function (more) {
                        more.addEventListener("click", function () {
                            openSkuModal(more.dataset.spuCode);
                        });
                    });

                // 点击"查看"按钮跳转编辑页
                container
                    .querySelectorAll(".sku-view-btn")
                    .forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var skuId = parseInt(btn.dataset.skuId, 10);
                            viewSku(skuId);
                        });
                    });

                // 点击"克隆"按钮
                container
                    .querySelectorAll(".sku-clone-btn")
                    .forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var skuId = parseInt(btn.dataset.skuId, 10);
                            cloneSku(skuId);
                        });
                    });
            }

            // ========== 大弹窗展示全部SKU ==========
            function openSkuModal(spuCode) {
                var groups = groupSkusBySpuCode(filterSkus());
                var skuList = groups[spuCode];
                if (!skuList) return;

                skuList.sort(function (a, b) {
                    return b.stock - a.stock;
                });

                var defaultSku = null;
                var storedId = spuDefaultMap[spuCode];
                if (storedId) {
                    for (var i = 0; i < skuList.length; i++) {
                        if (skuList[i].id === storedId) {
                            defaultSku = skuList[i];
                            break;
                        }
                    }
                }
                if (!defaultSku) {
                    defaultSku = skuList[0];
                }

                var tilesHtml = "";
                for (var s = 0; s < skuList.length; s++) {
                    var sku = skuList[s];
                    var isDefault = defaultSku && sku.id === defaultSku.id;

                    var specsHtml = "";
                    for (var sp = 0; sp < sku.specs.length; sp++) {
                        specsHtml +=
                            '<span class="spec-tag">' +
                            escapeHtml(sku.specs[sp].type) +
                            ": " +
                            escapeHtml(sku.specs[sp].value) +
                            "</span>";
                    }

                    tilesHtml +=
                        '<div class="sku-tile' +
                        (selectedSkuIds[sku.id] ? " selected" : "") +
                        '" data-spu-code="' +
                        escapeHtml(spuCode) +
                        '" data-sku-id="' +
                        sku.id +
                        '">' +
                        '<div class="sku-tile-img">' +
                        (sku.image
                            ? '<img src="' +
                              escapeHtml(sku.image) +
                              '" alt="" loading="lazy" />'
                            : '<div class="sku-tile-img-placeholder">📷</div>') +
                        "</div>" +
                        '<div class="sku-tile-name">' +
                        escapeHtml(sku.name) +
                        (sku.xsin
                            ? '<div class="sku-tile-xsin">' +
                              escapeHtml(sku.xsin) +
                              "</div>"
                            : "") +
                        "</div>" +
                        '<div class="sku-tile-specs">' +
                        specsHtml +
                        "</div>" +
                        '<div class="sku-tile-meta">' +
                        "<span>¥" +
                        sku.price +
                        "</span>" +
                        "<span>库存: " +
                        (sku.stock > 0 ? sku.stock : "充足") +
                        "</span>" +
                        '<span style="display:flex;gap:4px;align-items:center;">' +
                        (isDefault
                            ? '<span class="badge" style="background:#dbeafe;color:#1e40af;font-size:0.6rem;padding:1px 6px;">默认</span>'
                            : '<span class="badge set-default-badge" style="font-size:0.6rem;padding:1px 6px;">设为默认</span>') +
                        '<button class="sku-view-btn" data-sku-id="' +
                        sku.id +
                        '">查看</button>' +
                        '<button class="sku-clone-btn" data-sku-id="' +
                        sku.id +
                        '">克隆</button>' +
                        "</span>" +
                        "</div>" +
                        "</div>";
                }

                var overlay = document.createElement("div");
                overlay.className = "modal-overlay";
                overlay.innerHTML =
                    '<div class="modal-content">' +
                    '<div class="modal-header">' +
                    '<span class="modal-header-title">' +
                    escapeHtml(spuCode) +
                    " — 全部 " +
                    skuList.length +
                    " 个SKU</span>" +
                    '<button class="modal-close">✕</button>' +
                    "</div>" +
                    '<div class="modal-body">' +
                    '<div class="' +
                    (viewMode === "list" ? "sku-tile-list" : "sku-tile-grid") +
                    '">' +
                    tilesHtml +
                    "</div>" +
                    "</div>" +
                    "</div>";

                document.body.appendChild(overlay);

                // 关闭弹窗
                overlay
                    .querySelector(".modal-close")
                    .addEventListener("click", function () {
                        document.body.removeChild(overlay);
                    });
                overlay.addEventListener("click", function (e) {
                    if (e.target === overlay) {
                        document.body.removeChild(overlay);
                    }
                });

                // 弹窗内点击"设为默认"切换默认
                overlay
                    .querySelectorAll(".set-default-badge")
                    .forEach(function (badge) {
                        badge.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var tile = badge.closest(".sku-tile");
                            if (!tile) return;
                            var code = tile.dataset.spuCode;
                            var skuId = parseInt(tile.dataset.skuId, 10);
                            if (spuDefaultMap[code] !== skuId) {
                                spuDefaultMap[code] = skuId;
                                document.body.removeChild(overlay);
                                renderAll();
                            }
                        });
                    });

                // 弹窗内点击SKU卡片切换选中状态
                overlay.querySelectorAll(".sku-tile").forEach(function (tile) {
                    tile.addEventListener("click", function (e) {
                        if (
                            e.target.closest(".set-default-badge") ||
                            e.target.closest(".sku-view-btn") ||
                            e.target.closest(".sku-clone-btn")
                        )
                            return;
                        var skuId = parseInt(tile.dataset.skuId, 10);
                        if (selectedSkuIds[skuId]) {
                            delete selectedSkuIds[skuId];
                        } else {
                            selectedSkuIds[skuId] = true;
                        }
                        document.body.removeChild(overlay);
                        renderAll();
                    });
                });

                // 弹窗内"查看"按钮
                overlay
                    .querySelectorAll(".sku-view-btn")
                    .forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var skuId = parseInt(btn.dataset.skuId, 10);
                            document.body.removeChild(overlay);
                            viewSku(skuId);
                        });
                    });

                // 弹窗内"克隆"按钮
                overlay
                    .querySelectorAll(".sku-clone-btn")
                    .forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var skuId = parseInt(btn.dataset.skuId, 10);
                            document.body.removeChild(overlay);
                            cloneSku(skuId);
                        });
                    });
            }

            // ========== 工具函数 ==========
            function escapeHtml(str) {
                if (!str) return "";
                return String(str).replace(/[&<>]/g, function (m) {
                    if (m === "&") return "&amp;";
                    if (m === "<") return "&lt;";
                    if (m === ">") return "&gt;";
                    return m;
                });
            }

            // ========== 查看SKU（跳转编辑页） ==========
            function viewSku(skuId) {
                var sku = null;
                for (var i = 0; i < skus.length; i++) {
                    if (skus[i].id === skuId) {
                        sku = skus[i];
                        break;
                    }
                }
                if (!sku) return;
                localStorage.setItem("editingSku", JSON.stringify(sku));
                window.location.href = "SKU新增编辑.html";
            }

            // ========== 克隆SKU（跳转编辑页，预填充数据） ==========
            function cloneSku(skuId) {
                var sku = null;
                for (var i = 0; i < skus.length; i++) {
                    if (skus[i].id === skuId) {
                        sku = skus[i];
                        break;
                    }
                }
                if (!sku) return;
                var clone = JSON.parse(JSON.stringify(sku));
                clone.id = nextSkuId++;
                clone.xsin = "";
                localStorage.setItem("editingSku", JSON.stringify(clone));
                window.location.href = "SKU新增编辑.html";
            }

            // ========== 渲染未聚合SKU（每个独立卡片，与SPU同级） ==========
            function renderUngroupedList() {
                var container = document.getElementById("spuListContainer");
                var groups = groupSkusBySpuCode(filterSkus());
                var ungrouped = groups["__未分组__"];

                if (!ungrouped || ungrouped.length === 0) return;

                var html = "";
                for (var u = 0; u < ungrouped.length; u++) {
                    var usku = ungrouped[u];
                    var specsHtml = "";
                    for (var up = 0; up < usku.specs.length; up++) {
                        specsHtml +=
                            '<span class="spec-tag">' +
                            escapeHtml(usku.specs[up].type) +
                            ": " +
                            escapeHtml(usku.specs[up].value) +
                            "</span>";
                    }
                    var isSelected = selectedSkuIds[usku.id];
                    html +=
                        '<div class="spu-card' +
                        (isSelected ? " selected" : "") +
                        '" data-sku-id="' +
                        usku.id +
                        '" style="cursor:pointer;">' +
                        '<div class="spu-header">' +
                        '<label class="spu-select-all-label" title="选择/取消选择">' +
                        '<input type="checkbox" class="spu-select-all-cb" data-sku-id="' +
                        usku.id +
                        '"' +
                        (isSelected ? " checked" : "") +
                        ">" +
                        "</label>" +
                        '<div class="spu-header-main-wrap">' +
                        '<div class="spu-header-main">' +
                        '<div class="spu-hero-img">' +
                        (usku.image
                            ? '<img src="' +
                              escapeHtml(usku.image) +
                              '" alt="" loading="lazy" />'
                            : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#94a3b8;">📷</div>') +
                        "</div>" +
                        "<div>" +
                        '<div style="font-size:0.9rem;font-weight:600;color:#0f172a;">' +
                        escapeHtml(usku.name) +
                        "</div>" +
                        '<div class="spu-stats">未聚合 · 无SPU编码</div>' +
                        "</div>" +
                        "</div>" +
                        "</div>" +
                        '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;">' +
                        (usku.xsin
                            ? '<span style="font-size:0.7rem;color:#94a3b8;font-family:monospace;">' +
                              escapeHtml(usku.xsin) +
                              "</span>"
                            : "") +
                        specsHtml +
                        '<span style="font-size:0.8rem;font-weight:600;color:#0f172a;">¥' +
                        usku.price +
                        "</span>" +
                        '<span style="font-size:0.75rem;color:#64748b;">库存: ' +
                        (usku.stock > 0 ? usku.stock : "充足") +
                        "</span>" +
                        '<button class="sku-view-btn" data-sku-id="' +
                        usku.id +
                        '">查看</button>' +
                        '<button class="sku-clone-btn" data-sku-id="' +
                        usku.id +
                        '">克隆</button>' +
                        "</div>" +
                        "</div>" +
                        "</div>";
                }

                container.insertAdjacentHTML("beforeend", html);

                // 绑定事件：点击卡片选中/取消
                var cards = container.querySelectorAll(
                    ".spu-card[data-sku-id]",
                );
                cards.forEach(function (card) {
                    card.addEventListener("click", function (e) {
                        if (
                            e.target.closest(".sku-view-btn") ||
                            e.target.closest(".sku-clone-btn")
                        )
                            return;
                        var skuId = parseInt(card.dataset.skuId, 10);
                        if (selectedSkuIds[skuId]) {
                            delete selectedSkuIds[skuId];
                        } else {
                            selectedSkuIds[skuId] = true;
                        }
                        renderAll();
                    });
                });

                // 查看按钮
                cards.querySelectorAll(".sku-view-btn").forEach(function (btn) {
                    btn.addEventListener("click", function (e) {
                        e.stopPropagation();
                        viewSku(parseInt(btn.dataset.skuId, 10));
                    });
                });

                // 克隆按钮
                cards
                    .querySelectorAll(".sku-clone-btn")
                    .forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            cloneSku(parseInt(btn.dataset.skuId, 10));
                        });
                    });

                // 未聚合卡片复选框（独立于卡片点击）
                container
                    .querySelectorAll(
                        ".spu-card[data-sku-id] .spu-select-all-cb",
                    )
                    .forEach(function (cb) {
                        cb.addEventListener("click", function (e) {
                            e.stopPropagation();
                            var skuId = parseInt(cb.dataset.skuId, 10);
                            if (selectedSkuIds[skuId]) {
                                delete selectedSkuIds[skuId];
                            } else {
                                selectedSkuIds[skuId] = true;
                            }
                            renderAll();
                        });
                    });
            }

            // ========== 切换视图模式 ==========
            function toggleViewMode(mode) {
                viewMode = mode;
                document
                    .querySelectorAll(".view-toggle-btn")
                    .forEach(function (btn) {
                        btn.classList.toggle(
                            "active",
                            btn.dataset.view === mode,
                        );
                    });
                renderAll();
            }

            // ========== 切换在售/不可售选项卡 ==========
            function switchSaleTab(tab) {
                saleTab = tab;
                currentPage = 1;
                document.querySelectorAll(".sale-tab").forEach(function (el) {
                    el.classList.toggle("active", el.dataset.tab === tab);
                });
                renderAll();
            }

            // ========== 渲染全部（聚合SPU + 未聚合SKU） ==========
            function renderAll() {
                // 更新选项卡计数（基于全部SKU）
                var totalSelling = 0,
                    totalUnsellable = 0;
                skus.forEach(function (s) {
                    if (s.status === "上架") totalSelling++;
                    else totalUnsellable++;
                });
                var sellingEl = document.getElementById("tabSellingCount");
                if (sellingEl) sellingEl.textContent = totalSelling;
                var unsellableEl =
                    document.getElementById("tabUnsellableCount");
                if (unsellableEl) unsellableEl.textContent = totalUnsellable;

                renderSpuList();
                renderUngroupedList();
                renderPaginator();
            }

            // ========== 分页器 ==========
            function renderPaginator() {
                var container = document.getElementById("spuListContainer");
                var groups = groupSkusBySpuCode(filterSkus());
                var groupKeys = Object.keys(groups).filter(function (k) {
                    return k !== "__未分组__";
                });
                var ungrouped = groups["__未分组__"];
                var total =
                    groupKeys.length +
                    (ungrouped && ungrouped.length > 0 ? 1 : 0);
                var totalPages = Math.ceil(total / pageSize) || 1;
                if (totalPages <= 1) return;

                var infoHtml =
                    "共 <strong>" +
                    total +
                    "</strong> 项" +
                    (ungrouped && ungrouped.length > 0
                        ? "（含未聚合SKU）"
                        : "") +
                    "，" +
                    "<strong>" +
                    currentPage +
                    "/" +
                    totalPages +
                    "</strong> 页";

                var btnsHtml = "";
                // 上一页
                btnsHtml +=
                    '<button class="paginator-btn paginator-btn-prev" onclick="goToPage(' +
                    (currentPage - 1) +
                    ')"' +
                    (currentPage <= 1 ? " disabled" : "") +
                    ">‹ 上一页</button>";

                // 页码
                var maxVisible = 7;
                var half = Math.floor(maxVisible / 2);
                var startP = Math.max(1, currentPage - half);
                var endP = Math.min(totalPages, startP + maxVisible - 1);
                if (endP - startP < maxVisible - 1) {
                    startP = Math.max(1, endP - maxVisible + 1);
                }

                if (startP > 1) {
                    btnsHtml +=
                        '<button class="paginator-btn" onclick="goToPage(1)">1</button>';
                    if (startP > 2)
                        btnsHtml +=
                            '<button class="paginator-btn" disabled>…</button>';
                }
                for (var p = startP; p <= endP; p++) {
                    btnsHtml +=
                        '<button class="paginator-btn' +
                        (p === currentPage ? " active" : "") +
                        '" onclick="goToPage(' +
                        p +
                        ')">' +
                        p +
                        "</button>";
                }
                if (endP < totalPages) {
                    if (endP < totalPages - 1)
                        btnsHtml +=
                            '<button class="paginator-btn" disabled>…</button>';
                    btnsHtml +=
                        '<button class="paginator-btn" onclick="goToPage(' +
                        totalPages +
                        ')">' +
                        totalPages +
                        "</button>";
                }

                // 下一页
                btnsHtml +=
                    '<button class="paginator-btn paginator-btn-next" onclick="goToPage(' +
                    (currentPage + 1) +
                    ')"' +
                    (currentPage >= totalPages ? " disabled" : "") +
                    ">下一页 ›</button>";

                container.insertAdjacentHTML(
                    "beforeend",
                    '<div class="paginator">' +
                        '<div class="paginator-info">' +
                        infoHtml +
                        "</div>" +
                        '<div class="paginator-btns">' +
                        btnsHtml +
                        "</div>" +
                        "</div>",
                );
            }

            function goToPage(page) {
                var groups = groupSkusBySpuCode(skus);
                var groupKeys = Object.keys(groups).filter(function (k) {
                    return k !== "__未分组__";
                });
                var ungrouped = groups["__未分组__"];
                var total =
                    groupKeys.length +
                    (ungrouped && ungrouped.length > 0 ? 1 : 0);
                var totalPages = Math.ceil(total / pageSize) || 1;
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderAll();
            }

            // ========== 初始化 ==========
            initDemoData();
        </script>
    </body>
</html>
